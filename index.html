<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ Thống Chấm Công</title>
    <link rel="icon" type="image/jpg" href="images/TUDUYTRE.jpg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="images/TUDUYTRE.jpg">
    <link rel="stylesheet" href="css/style.css?v=20260620-season-mobile">
    <link rel="stylesheet" href="css/login.css?v=20260620-season-mobile">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js"></script>
    <script src="js/firebase-config.js?v=secure1"></script>
    <script src="js/db-service.js?v=secure1"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <main class="login-wrapper" aria-label="Đăng nhập hệ thống">
        <div class="season-sky" aria-hidden="true">
            <span class="season-shape shape-1"></span>
            <span class="season-shape shape-2"></span>
            <span class="season-shape shape-3"></span>
            <span class="season-shape shape-4"></span>
            <span class="season-line line-1"></span>
            <span class="season-line line-2"></span>
        </div>

        <section class="season-panel" aria-hidden="true">
            <div class="season-label" id="season-label">Mùa học tập</div>
            <h2 id="season-title">Mỗi ngày tiến bộ một chút</h2>
            <p id="season-copy">Kiến thức vững vàng bắt đầu từ sự chăm chỉ hôm nay.</p>
            <div class="season-mini-board">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </section>

        <section class="login-card">
            <div class="login-header">
                <img src="images/TUDUYTRE.jpg" alt="Logo Ngoại Ngữ & Toán Tư Duy Trẻ" class="login-logo">
                <p class="login-kicker">Ngoại Ngữ & Toán Tư Duy Trẻ</p>
                <h1>Chào mừng trở lại</h1>
                <p>Hệ thống chấm công và tính lương tự động</p>
                <blockquote id="season-quote">Hôm nay học chắc, ngày mai bước xa.</blockquote>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" class="form-input" placeholder="Nhập tên đăng nhập" required>
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <div class="password-field">
                        <input type="password" id="password" class="form-input" placeholder="Nhập mật khẩu" required>
                        <button type="button" id="toggle-password" aria-label="Hiện mật khẩu" title="Hiện mật khẩu">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn">Đăng nhập</button>

                <div id="login-error" class="login-error" style="display: none;"></div>

                <div class="login-help">
                    <a href="#">Quên mật khẩu? Liên hệ Admin</a>
                </div>
            </form>
        </section>
    </main>

    <script src="js/ui-service.js?v=secure1"></script>
    <script src="js/main.js?v=20260620-season-mobile"></script>
    <script src="js/login-theme.js?v=20260620-season-mobile"></script>
    <script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" }) }</script>
</body>

</html>
