<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ Thống Chấm Công</title>
    <link rel="icon" type="image/jpg" href="images/TUDUYTRE.jpg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="images/TUDUYTRE.jpg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <!-- Firebase SDK (Compat) -->
    <script src='https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js'></script>
    <script src='https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js'></script>
    <script src='https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js'></script>
    <script src='https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js'></script>

    <!-- App Config -->
    <script src='js/firebase-config.js?v=secure1'></script>
    <script src='js/db-service.js?v=secure1'></script>
</head>

<body>
    <div class="login-wrapper">
        <!-- background decor -->
        <div class="decor-orb orb-1"></div>
        <div class="decor-orb orb-2"></div>

        <!-- Hanging Lanterns -->
        <div class="lantern-container lantern-left">
            <div class="lantern">
                <span class="lantern-text">Tết</span>
            </div>
        </div>
        <div class="lantern-container lantern-right">
            <div class="lantern">
                <span class="lantern-text">Xuân</span>
            </div>
        </div>

        <!-- Falling Blossoms (CSS Animation) -->
        <div class="blossom-container">
            <div class="blossom b1"></div>
            <div class="blossom b2"></div>
            <div class="blossom b3"></div>
            <div class="blossom b4"></div>
            <div class="blossom b5"></div>
        </div>

        <!-- Clouds -->
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>

        <div class="login-card">
            <div class="login-header">
                <div class="logo-area flex-center login-logo">
                    <img src="images/TUDUYTRE.jpg" alt="Logo" class="login-logo-img">
                </div>
                <h1>Chào mừng trở lại!</h1>
                <p class="login-subtitle">Hệ thống Chấm công & Tính lương Tự động</p>
                <div class="login-greeting">✨ Chúc Mừng Năm Mới 2026 - Vạn Sự Như Ý ✨</div>

            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" class="form-input" placeholder="Nhập tên đăng nhập..." required>
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <div style="position:relative;">
                        <input type="password" id="password" class="form-input password-input" placeholder="••••••••" required>
                        <button type="button" id="toggle-password" class="toggle-password-btn" aria-label="Hiển thị mật khẩu" title="Hiển thị mật khẩu"
                            onclick="(function(){
                                var inp=document.getElementById('password');
                                var btn=document.getElementById('toggle-password');
                                if(inp.type==='password'){
                                    inp.type='text';
                                    btn.innerHTML='<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'20\' height=\'20\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\'><path d=\'M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94\'/><path d=\'M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19\'/><line x1=\'1\' y1=\'1\' x2=\'23\' y2=\'23\'/></svg>';
                                    btn.setAttribute('aria-label', 'Ẩn mật khẩu');
                                    btn.setAttribute('title', 'Ẩn mật khẩu');
                                }else{
                                    inp.type='password';
                                    btn.innerHTML='<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'20\' height=\'20\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\'><path d=\'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\'/><circle cx=\'12\' cy=\'12\' r=\'3\'/></svg>';
                                    btn.setAttribute('aria-label', 'Hiển thị mật khẩu');
                                    btn.setAttribute('title', 'Hiển thị mật khẩu');
                                }
                            })()">
                            <svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round'><path d='M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z'/><circle cx='12' cy='12' r='3'/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    Đăng Nhập
                </button>

                <div id="login-error" class="login-error-msg" style="display: none;">
                </div>

                <div class="login-footer">
                    <a href="#">Quên mật khẩu? Liên hệ Admin</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/ui-service.js?v=secure1"></script>
    <script src="js/main.js?v=secure1"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("service-worker.js")}</script>
</body>

</html>
