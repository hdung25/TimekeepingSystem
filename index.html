<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ Thống Chấm Công</title>
    <link rel="icon" type="image/jpg" href="images/TUDUYTRE.jpg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="images/TUDUYTRE.jpg">
    <link rel="stylesheet" href="css/login.css?v=20260621-font">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js"></script>
    <script src="js/firebase-config.js?v=secure1"></script>
    <script src="js/db-service.js?v=20260805-group10p-fix-v1"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <!-- TOP BANNER -->
    <div class="login-banner">Chào mùa hè 2026 rực rỡ!</div>

    <main class="login-wrapper" aria-label="Đăng nhập hệ thống">
        <!-- Full screen background -->
        <div class="login-bg" aria-hidden="true"></div>

        <!-- Login Card -->
        <section class="login-card">
            <div class="login-header">
                <img src="images/TUDUYTRE.jpg" alt="Logo Ngoại Ngữ & Toán Tư Duy Trẻ" class="login-logo">
                <p class="login-kicker">Ngoại Ngữ & Toán Tư Duy Trẻ</p>
                <h1>CHÀO MỪNG TRỞ LẠI!</h1>
                <p>Hệ thống Chấm công & Tính lương Tự động</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" class="form-input" placeholder="admin" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <div class="password-field">
                        <input type="password" id="password" class="form-input" placeholder="password" required autocomplete="current-password">
                        <button type="button" id="toggle-password" aria-label="Hiện mật khẩu" title="Hiện mật khẩu">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn">Đăng Nhập</button>

                <div id="login-error" class="login-error" style="display: none;"></div>

                <div class="login-help">
                    <a href="#">Quên mật khẩu? Liên hệ Admin</a>
                </div>
            </form>
        </section>
    </main>

    <script src="js/ui-service.js?v=20260803-early10-v1"></script>
    <script src="js/main.js?v=20260805-trust-multiselect-v1"></script>
    <script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" }) }</script>
</body>

</html>
