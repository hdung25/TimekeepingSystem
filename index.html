<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ Thống Chấm Công</title>
    <link rel="icon" type="image/jpg" href="images/TUDUYTRE.jpg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="images/TUDUYTRE.jpg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <!-- Firebase SDK (Compat) -->
    <script src='https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js'></script>
    <script src='https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js'></script>
    <script src='https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js'></script>
    <script src='https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js'></script>

    <!-- App Config -->
    <script src='js/firebase-config.js?v=secure1'></script>
    <script src='js/db-service.js?v=secure1'></script>
</head>

<body>
    <div class="login-wrapper">
        <!-- background decor -->
        <div class="decor-orb orb-1"></div>
        <div class="decor-orb orb-2"></div>

        <!-- Hanging Lanterns -->
        <div class="lantern-container lantern-left">
            <div class="lantern">
                <span class="lantern-text">Tết</span>
            </div>
        </div>
        <div class="lantern-container lantern-right">
            <div class="lantern">
                <span class="lantern-text">Xuân</span>
            </div>
        </div>

        <!-- Falling Blossoms (CSS Animation) -->
        <div class="blossom-container">
            <div class="blossom b1"></div>
            <div class="blossom b2"></div>
            <div class="blossom b3"></div>
            <div class="blossom b4"></div>
            <div class="blossom b5"></div>
        </div>

        <!-- Clouds -->
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>

        <div class="login-card">
            <div class="login-header">
                <div class="logo-area flex-center" style="justify-content: center; margin-bottom: 1rem;">
                    <img src="images/TUDUYTRE.jpg" alt="Logo"
                        style="height: 70px; margin-right: 0.5rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                </div>
                <h1>Chào mừng trở lại!</h1>
                <p style="color: var(--brand-green); font-weight: 600;">Hệ thống Chấm công & Tính lương Tự động</p>
                <div style="margin-top: 5px; font-size: 0.85rem; color: var(--tet-gold);">✨ Chúc Mừng Năm Mới 2026 - Vạn
                    Sự Như Ý ✨</div>

            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" class="form-input" placeholder="Nhập tên đăng nhập..." required>
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <div style="position:relative;">
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required
                            style="padding-right:2.75rem;">
                        <button type="button" id="toggle-password" aria-label="Hiện mật khẩu" title="Hiện mật khẩu" onclick="(function(){
                                var inp=document.getElementById('password');
                                var btn=document.getElementById('toggle-password');
                                if(inp.type==='password'){
                                    inp.type='text';
                                    btn.innerHTML='<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'20\' height=\'20\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\'><path d=\'M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94\'/><path d=\'M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19\'/><line x1=\'1\' y1=\'1\' x2=\'23\' y2=\'23\'/></svg>';
                                }else{
                                    inp.type='password';
                                    btn.innerHTML='<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'20\' height=\'20\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\'><path d=\'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\'/><circle cx=\'12\' cy=\'12\' r=\'3\'/></svg>';
                                }
                            })()"
                            style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9CA3AF;display:flex;align-items:center;padding:0;line-height:1;">
                            <svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24'
                                fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round'>
                                <path d='M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z' />
                                <circle cx='12' cy='12' r='3' />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    Đăng Nhập
                </button>

                <div id="login-error"
                    style="display: none; margin-top: 1rem; padding: 0.75rem; background: #FEF2F2; border: 1px solid #FECACA; border-radius: 8px; color: #DC2626; font-size: 0.9rem; text-align: center; font-weight: 500;">
                </div>

                <div class="text-center" style="margin-top: 1.5rem; font-size: 0.875rem; color: #6B7280;">
                    <a href="#" style="transition: color 0.2s;">Quên mật khẩu? Liên hệ Admin</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/ui-service.js?v=secure1"></script>
    <script src="js/main.js?v=secure1"></script>
    <script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("service-worker.js") }</script>
</body>

</html>
