<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Họp Của Tôi - Hệ Thống Chấm Công</title>
    <link rel="icon" type="image/jpg" href="images/TUDUYTRE.jpg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="images/TUDUYTRE.jpg">
    <link rel="stylesheet" href="css/style.css?v=20260831-scheduler-hd-v2">

    <style>
        .mymeet-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1.75rem;
        }

        .mymeet-stat {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.1rem 1.25rem;
            box-shadow: var(--shadow-sm);
        }

        .mymeet-stat .label {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mymeet-stat .value {
            font-size: 1.9rem;
            font-weight: 800;
            margin-top: 0.35rem;
            line-height: 1;
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 1.75rem 0 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mymeet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.1rem;
        }

        /* Hero card — cuộc họp cần điểm danh hôm nay */
        .hero-card {
            position: relative;
            overflow: hidden;
            border-radius: 18px;
            padding: 1.5rem;
            color: white;
            background: linear-gradient(135deg, #059669 0%, #047857 55%, #065F46 100%);
            box-shadow: 0 12px 30px rgba(5, 150, 105, 0.28);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: -40px;
            right: -30px;
            width: 160px;
            height: 160px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
        }

        .hero-card.done {
            background: linear-gradient(135deg, #6B7280 0%, #4B5563 100%);
            box-shadow: 0 12px 30px rgba(75, 85, 99, 0.25);
        }

        .hero-checkin-btn {
            width: 100%;
            padding: 1rem;
            border-radius: 14px;
            border: none;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            background: white;
            color: #047857;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
        }

        .hero-checkin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22);
        }

        .hero-checkin-btn:disabled {
            background: rgba(255, 255, 255, 0.35);
            color: rgba(255, 255, 255, 0.85);
            cursor: not-allowed;
            box-shadow: none;
        }

        .meet-preview-btn {
            width: 100%;
            margin-top: 4px;
            padding: 0.7rem;
            border-radius: 12px;
            border: 1.5px dashed var(--border-color);
            background: #F9FAFB;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 700;
            font-family: inherit;
            cursor: not-allowed;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* RSVP (xác nhận tham gia) */
        .rsvp-box { margin-top: 4px; padding-top: 0.8rem; border-top: 1px dashed var(--border-color); }
        .rsvp-q { font-size: 0.8rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.55rem; }
        .rsvp-row { display: flex; gap: 8px; }
        .rsvp-btn { flex: 1; padding: 0.65rem 0.5rem; border-radius: 11px; font-size: 0.85rem; font-weight: 700; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all .15s; }
        .rsvp-yes { background: #ECFDF5; color: #047857; border: 1.5px solid #6EE7B7; }
        .rsvp-yes:hover { background: #059669; color: white; border-color: #059669; }
        .rsvp-no { background: white; color: #B45309; border: 1.5px solid #FCD34D; }
        .rsvp-no:hover { background: #FFFBEB; }
        .rsvp-state { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 600; padding: 0.6rem 0.75rem; border-radius: 11px; }
        .rsvp-state.yes { background: #ECFDF5; color: #047857; }
        .rsvp-state.no { background: #FFFBEB; color: #B45309; }
        .rsvp-change { background: none; border: none; color: var(--text-muted); font-size: 0.76rem; font-weight: 600; cursor: pointer; text-decoration: underline; font-family: inherit; margin-top: 0.4rem; padding: 0; }
        .rsvp-change:hover { color: var(--primary-color); }
        .mm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .mm-modal { background: white; border-radius: 18px; max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .mm-modal-h { padding: 1.1rem 1.3rem; border-bottom: 1px solid var(--border-color); font-weight: 800; font-size: 1.05rem; color: var(--text-main); }
        .mm-modal-b { padding: 1.2rem 1.3rem; }
        .mm-modal-b textarea { width: 100%; box-sizing: border-box; padding: 0.7rem 0.85rem; border: 1.5px solid var(--border-color); border-radius: 12px; font-size: 0.9rem; font-family: inherit; resize: vertical; outline: none; }
        .mm-modal-b textarea:focus { border-color: var(--primary-color); }
        .mm-modal-f { padding: 0 1.3rem 1.2rem; display: flex; gap: 0.6rem; }
        .mm-modal-f button { flex: 1; padding: 0.75rem; border-radius: 12px; font-weight: 700; font-family: inherit; cursor: pointer; border: none; font-size: 0.9rem; }
        .mm-cancel { background: #F3F4F6; color: #374151; }
        .mm-confirm { background: #059669; color: white; }
        .mm-confirm:hover { background: #047857; }

        /* Card thường (sắp tới / đã qua) — đồng bộ ngôn ngữ với hero card */
        .meet-card {
            position: relative;
            overflow: hidden;
            background: white;
            border: 1px solid var(--border-color);
            border-left: 4px solid #7C3AED;
            border-radius: 18px;
            padding: 1.5rem;
            box-shadow: 0 8px 24px rgba(17, 24, 39, 0.06);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .meet-card::before {
            content: '';
            position: absolute;
            top: -40px;
            right: -30px;
            width: 160px;
            height: 160px;
            background: rgba(124, 58, 237, 0.06);
            border-radius: 50%;
        }

        .meet-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(17, 24, 39, 0.1);
        }

        .meet-card>* { position: relative; z-index: 1; }

        .meet-card.past { border-left-color: #D1D5DB; }
        .meet-card.past::before { background: rgba(107, 114, 128, 0.06); }

        .meet-kicker {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #7C3AED;
        }

        .meet-card.past .meet-kicker { color: var(--text-muted); }

        .meet-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin-top: 4px;
            line-height: 1.3;
            color: var(--text-main);
        }

        .meet-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .meet-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .countdown-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.18);
            padding: 5px 12px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.82rem;
            backdrop-filter: blur(4px);
        }

        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-muted);
            background: white;
            border: 1px dashed var(--border-color);
            border-radius: 14px;
        }

        @keyframes pulse-live {
            0%, 100% { box-shadow: 0 12px 30px rgba(5, 150, 105, 0.28); }
            50% { box-shadow: 0 12px 40px rgba(5, 150, 105, 0.5); }
        }

        @media (max-width: 640px) {
            .mymeet-grid { grid-template-columns: 1fr; }
            .meet-card { padding: 1.15rem; border-radius: 16px; gap: 0.85rem; }
            .hero-card { padding: 1.25rem; border-radius: 16px; }
            .meet-title { font-size: 1.1rem; }
        }
    </style>

    <!-- Firebase SDK (Compat) -->
    <script src='https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js'></script>
    <script src='https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js'></script>
    <script src='https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js'></script>

    <!-- App Config -->
    <script src='js/firebase-config.js?v=20260831-scheduler-hd-v2'></script>
    <script src='js/db-service.js?v=20260831-scheduler-hd-v2'></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <img src="images/TUDUYTRE.jpg" alt="Logo"
                    style="height: 40px; margin-right: 0.5rem; border-radius: 4px;">
                <span style="font-size: 0.9rem; font-weight: 700;">NGOẠI NGỮ & TOÁN TƯ DUY TRẺ</span>
            </div>
            <nav id="sidebar-nav">
                <!-- Rendered by main.js -->
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="margin-bottom: 1.75rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                <div>
                    <h1 style="font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 8px;">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M9 16l2 2 4-4"/></svg>
                        Họp Của Tôi
                    </h1>
                    <p style="color: var(--text-muted);">Điểm danh họp định kỳ & theo dõi lịch họp của bạn</p>
                </div>
                <div class="month-navigator" style="display: inline-flex; align-items: center; background: white; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 4px; box-shadow: var(--shadow-sm);">
                    <button type="button" class="month-nav-btn" onclick="myMeetChangeMonth(-1)" style="background: transparent; border: none; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-weight: 700; color: var(--text-muted);">&lt;</button>
                    <span id="mymeet-month" style="padding: 0 1rem; font-weight: 700; min-width: 130px; text-align: center;">Tháng --, ----</span>
                    <button type="button" class="month-nav-btn" onclick="myMeetChangeMonth(1)" style="background: transparent; border: none; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-weight: 700; color: var(--text-muted);">&gt;</button>
                </div>
            </header>

            <!-- Stats -->
            <div class="mymeet-stats" id="mymeet-stats">
                <div class="mymeet-stat"><div class="label">Cuộc họp tháng này</div><div class="value" style="color:#7C3AED;" id="st-total">--</div></div>
                <div class="mymeet-stat"><div class="label">Đã tham dự</div><div class="value" style="color:#059669;" id="st-present">--</div></div>
                <div class="mymeet-stat"><div class="label">Đi trễ</div><div class="value" style="color:#D97706;" id="st-late">--</div></div>
                <div class="mymeet-stat"><div class="label">Vắng / Chưa ĐD</div><div class="value" style="color:#EF4444;" id="st-absent">--</div></div>
            </div>

            <!-- Actionable today -->
            <div id="today-section">
                <div class="section-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    Cần điểm danh hôm nay
                </div>
                <div class="mymeet-grid" id="today-grid"></div>
            </div>

            <!-- Upcoming -->
            <div id="upcoming-section" style="display:none;">
                <div class="section-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    Sắp tới
                </div>
                <div class="mymeet-grid" id="upcoming-grid"></div>
            </div>

            <!-- Past / history -->
            <div id="past-section" style="display:none;">
                <div class="section-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><polyline points="12 7 12 12 15 13.5"/></svg>
                    Đã qua
                </div>
                <div class="mymeet-grid" id="past-grid"></div>
            </div>

            <!-- Global loading / empty -->
            <div id="mymeet-loading" class="empty-state" style="margin-top: 1rem;">Đang tải lịch họp của bạn...</div>
        </main>
    </div>

    <script src="js/ui-service.js?v=20260803-early10-v1"></script>
    <script src="js/main.js?v=20260831-scheduler-hd-v2"></script>
    <script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" }) }</script>

    <script>
        let mmCurrentDate = new Date();
        let mmUserId = null;
        let mmUserSpecsUpper = '';
        let mmCountdownTimer = null;

        const MONTHS_VN = ["Tháng 01","Tháng 02","Tháng 03","Tháng 04","Tháng 05","Tháng 06","Tháng 07","Tháng 08","Tháng 09","Tháng 10","Tháng 11","Tháng 12"];

        // Bộ icon SVG (thay cho emoji) — kế thừa màu chữ qua currentColor
        function svgIcon(paths, size) {
            size = size || 14;
            return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; flex-shrink:0;">${paths}</svg>`;
        }
        const ICON = {
            cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
            clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
            timer: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 1"/><line x1="9" y1="2" x2="15" y2="2"/>',
            users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
            globe: '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
            pin: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
            hourglass: '<path d="M5 22h14M5 2h14M17 22v-4.2a2 2 0 0 0-.6-1.4L12 12l-4.4 4.4A2 2 0 0 0 7 17.8V22M7 2v4.2a2 2 0 0 0 .6 1.4L12 12l4.4-4.4A2 2 0 0 0 17 6.2V2"/>',
            check: '<polyline points="20 6 9 17 4 12"/>',
            wifi: '<path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>',
        };

        function mmUpdateMonthLabel() {
            document.getElementById('mymeet-month').innerText = `${MONTHS_VN[mmCurrentDate.getMonth()]}, ${mmCurrentDate.getFullYear()}`;
        }

        function mmFormatDate(dateStr) {
            if (!dateStr) return '';
            const p = dateStr.slice(0, 10).split('-');
            return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : dateStr;
        }

        function mmMk(dateStr, timeStr) {
            const [y, mo, d] = dateStr.split('-').map(Number);
            const [h, mi] = (timeStr || '00:00').split(':').map(Number);
            return new Date(y, mo - 1, d, h, mi, 0);
        }

        // Một bản ghi điểm danh CHỈ hợp lệ nếu được tạo sau khi khung giờ điểm danh mở.
        // Vô hiệu hoá các bản ghi "điểm danh sẵn" tạo trước ngày họp (dữ liệu cũ).
        function mmIsValidCheckIn(log, m) {
            if (!log || !log.status) return false;
            if (log.status === 'Chưa điểm danh') return false;
            if (log.adminOverride) return true;   // admin chỉnh tay -> luôn hợp lệ
            if (!log.checkInTime) return true;    // không có mốc giờ -> coi như hợp lệ
            return new Date(log.checkInTime) >= mmMk(m.date, m.checkInStart);
        }

        function mmIsInvited(meeting) {
            if (Array.isArray(meeting.attendees) && meeting.attendees.length > 0) {
                return meeting.attendees.includes(mmUserId);
            }
            const deptKey = (meeting.department || '').toUpperCase();
            if (deptKey === 'TG TA') return mmUserSpecsUpper.includes('TG TA');
            if (deptKey === 'TG T-TV') return mmUserSpecsUpper.includes('TG T-TV');
            if (deptKey === 'TOÁN TƯ DUY' || deptKey === 'TTD') return mmUserSpecsUpper.includes('TOÁN TƯ DUY') || mmUserSpecsUpper.includes('TTD');
            if (deptKey === 'TIẾP TÂN' || deptKey === 'TT') return mmUserSpecsUpper.includes('TIẾP TÂN') || mmUserSpecsUpper.includes('TT');
            return false;
        }

        function mmStatusPill(status) {
            const map = {
                'Có': { bg: '#D1FAE5', color: '#047857', label: 'Có mặt' },
                'Trễ': { bg: '#FEF3C7', color: '#B45309', label: 'Đi trễ' },
                'Vắng phép': { bg: '#E0E7FF', color: '#4338CA', label: 'Vắng phép' },
                'Vắng đột xuất': { bg: '#FFE4E6', color: '#BE123C', label: 'Vắng đột xuất' },
                'Vắng không phép': { bg: '#FEE2E2', color: '#DC2626', label: 'Vắng không phép' },
                'Chưa điểm danh': { bg: '#F3F4F6', color: '#6B7280', label: 'Chưa điểm danh' },
            };
            const s = map[status] || map['Chưa điểm danh'];
            return `<span class="meet-pill" style="background:${s.bg};color:${s.color};">${s.label}</span>`;
        }

        function mmTypeBadge(meeting) {
            let t = meeting.type;
            if (!t) {
                const title = meeting.title || '';
                t = title.startsWith('[Online]') ? 'online' : (title.startsWith('[Trực tiếp]') ? 'direct' : '');
            }
            if (t === 'online') return `<span class="meet-pill" style="background:#DBEAFE;color:#1D4ED8;">${svgIcon(ICON.globe)} Online</span>`;
            if (t === 'direct') return `<span class="meet-pill" style="background:#D1FAE5;color:#047857;">${svgIcon(ICON.pin)} Trực tiếp</span>`;
            return '';
        }

        function mmCleanTitle(meeting) {
            let title = meeting.title || 'Họp định kỳ';
            if (title.startsWith('[Online] ')) title = title.substring(9);
            else if (title.startsWith('[Trực tiếp] ')) title = title.substring(12);
            return title;
        }

        function mmDeptLabel(meeting) {
            return meeting.department === 'CUSTOM' ? 'Tự chọn thành viên' : meeting.department;
        }

        async function mmLoad() {
            const loadingEl = document.getElementById('mymeet-loading');
            loadingEl.style.display = 'block';
            loadingEl.innerText = 'Đang tải lịch họp của bạn...';

            const year = mmCurrentDate.getFullYear();
            const month = mmCurrentDate.getMonth();
            const monthStr = `${year}-${String(month + 1).padStart(2, '0')}`;

            try {
                const allMeetings = await DBService.getMeetingsForMonth(monthStr);
                const myMeetings = (allMeetings || []).filter(mmIsInvited);

                // Lấy trạng thái điểm danh của tôi cho từng cuộc họp
                const statusMap = {};
                await Promise.all(myMeetings.map(async (m) => {
                    statusMap[m.id] = await DBService.getMyMeetingStatus(m.id, mmUserId);
                }));

                mmRender(myMeetings, statusMap);
            } catch (err) {
                console.error("Lỗi tải họp của tôi:", err);
                loadingEl.style.display = 'block';
                loadingEl.innerText = 'Lỗi tải lịch họp. Vui lòng thử lại.';
            }
        }

        function mmRender(meetings, statusMap) {
            const now = new Date();
            const todayGrid = document.getElementById('today-grid');
            const upcomingGrid = document.getElementById('upcoming-grid');
            const pastGrid = document.getElementById('past-grid');
            const loadingEl = document.getElementById('mymeet-loading');

            todayGrid.innerHTML = '';
            upcomingGrid.innerHTML = '';
            pastGrid.innerHTML = '';

            // CHỐT VẮNG KHÔNG PHÉP: họp đã kết thúc, đã bấm ĐI (rsvp yes) nhưng không điểm danh.
            // Ghi 1 lần vào meeting_attendance để admin thấy; lần sau status đã là VKP nên bỏ qua.
            meetings.forEach(m => {
                const raw = statusMap[m.id];
                if (!raw) return;
                const end = mmMk(m.date, m.endTime);
                const attended = mmIsValidCheckIn(raw, m) && (raw.status === 'Có' || raw.status === 'Trễ');
                const alreadyResolved = ['Vắng phép', 'Vắng đột xuất', 'Vắng không phép'].includes(raw.status) || raw.adminOverride;
                if (now > end && raw.rsvp === 'yes' && !attended && !alreadyResolved) {
                    raw.status = 'Vắng không phép'; // cập nhật local để hiển thị/stat ngay
                    DBService.resolveMeetingNoShow(m.id, mmUserId, raw.userName || '').catch(() => {});
                }
            });

            // Stats — chỉ tính bản ghi điểm danh hợp lệ (tạo sau khi mở điểm danh)
            let present = 0, late = 0, absentOrPending = 0;
            meetings.forEach(m => {
                const raw = statusMap[m.id];
                const log = mmIsValidCheckIn(raw, m) ? raw : null;
                const end = mmMk(m.date, m.endTime);
                if (log && (log.status === 'Có')) present++;
                else if (log && log.status === 'Trễ') { present++; late++; }
                else if (log && (log.status === 'Vắng phép' || log.status === 'Vắng đột xuất' || log.status === 'Vắng không phép')) absentOrPending++;
                else if (now > end) absentOrPending++; // đã kết thúc mà chưa điểm danh
            });
            document.getElementById('st-total').innerText = meetings.length;
            document.getElementById('st-present').innerText = present;
            document.getElementById('st-late').innerText = late;
            document.getElementById('st-absent').innerText = absentOrPending;

            // Phân loại
            const actionable = []; // đang trong khung [checkInStart, endTime] hoặc đã điểm danh hôm nay
            const upcoming = [];
            const past = [];

            meetings.forEach(m => {
                const ciStart = mmMk(m.date, m.checkInStart);
                const end = mmMk(m.date, m.endTime);
                const log = statusMap[m.id];

                if (now >= ciStart && now <= end) {
                    actionable.push(m);
                } else if (now < ciStart) {
                    upcoming.push(m);
                } else {
                    past.push(m);
                }
            });

            // Sắp xếp
            const byDateTime = (a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime);
            actionable.sort(byDateTime);
            upcoming.sort(byDateTime);
            past.sort((a, b) => (b.date + b.startTime).localeCompare(a.date + a.startTime));

            // Render actionable (hero)
            if (actionable.length > 0) {
                actionable.forEach(m => todayGrid.appendChild(mmHeroCard(m, statusMap[m.id])));
            } else {
                todayGrid.innerHTML = `<div class="empty-state">Hiện không có cuộc họp nào cần điểm danh.</div>`;
            }

            // Upcoming
            const upSection = document.getElementById('upcoming-section');
            if (upcoming.length > 0) {
                upSection.style.display = 'block';
                upcoming.forEach(m => upcomingGrid.appendChild(mmNormalCard(m, statusMap[m.id], 'upcoming')));
            } else {
                upSection.style.display = 'none';
            }

            // Past
            const pastSection = document.getElementById('past-section');
            if (past.length > 0) {
                pastSection.style.display = 'block';
                past.forEach(m => pastGrid.appendChild(mmNormalCard(m, statusMap[m.id], 'past')));
            } else {
                pastSection.style.display = 'none';
            }

            loadingEl.style.display = 'none';

            // Countdown updater cho các thẻ actionable
            if (mmCountdownTimer) clearInterval(mmCountdownTimer);
            mmCountdownTimer = setInterval(mmTickCountdowns, 1000);
            mmTickCountdowns();
        }

        function mmHeroCard(m, log) {
            const now = new Date();
            const ciStart = mmMk(m.date, m.checkInStart);
            const ciClose = mmMk(m.date, m.checkInClose);
            const end = mmMk(m.date, m.endTime);

            const card = document.createElement('div');
            // Chỉ coi là đã điểm danh khi bản ghi hợp lệ (tạo sau khi mở điểm danh)
            const alreadyDone = mmIsValidCheckIn(log, m);
            card.className = 'hero-card' + (alreadyDone ? ' done' : '');
            if (!alreadyDone) card.style.animation = 'pulse-live 2.5s infinite';

            let actionHtml = '';
            if (alreadyDone) {
                const t = log.checkInTime ? new Date(log.checkInTime).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) : '';
                actionHtml = `
                    <div style="background: rgba(255,255,255,0.15); border-radius: 14px; padding: 0.9rem 1rem; display: flex; align-items: center; gap: 10px; font-weight: 700;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                        <span>Đã điểm danh: ${log.status === 'Trễ' ? 'Đi trễ' : (log.status === 'Có' ? 'Có mặt' : log.status)}${t ? ' lúc ' + t : ''}</span>
                    </div>`;
            } else {
                const willBeLate = now > ciClose;
                const label = willBeLate ? 'Điểm danh (sẽ tính Trễ)' : 'Điểm danh ngay';
                actionHtml = `
                    <button class="hero-checkin-btn" data-mid="${m.id}" onclick="mmCheckIn('${m.id}', this)" ${willBeLate ? 'style="color:#B45309;"' : ''}>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                        ${label}
                    </button>`;
            }

            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; position:relative; z-index:1;">
                    <div>
                        <div style="font-size:0.72rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; opacity:0.85;">Họp định kỳ hôm nay</div>
                        <div style="font-size:1.25rem; font-weight:800; margin-top:4px; line-height:1.3;">${mmCleanTitle(m)}</div>
                    </div>
                    ${!alreadyDone ? `<span class="countdown-badge" data-countdown="${m.id}" data-close="${ciClose.getTime()}" data-end="${end.getTime()}">${svgIcon(ICON.hourglass)} --</span>` : ''}
                </div>
                <div style="display:flex; gap:6px; flex-wrap:wrap; position:relative; z-index:1;">
                    ${mmTypeBadge(m).replace('background:#DBEAFE;color:#1D4ED8;','background:rgba(255,255,255,0.2);color:white;').replace('background:#D1FAE5;color:#047857;','background:rgba(255,255,255,0.2);color:white;')}
                    <span class="meet-pill" style="background:rgba(255,255,255,0.2);color:white;">${svgIcon(ICON.users)} ${mmDeptLabel(m)}</span>
                    <span class="meet-pill" style="background:rgba(255,255,255,0.2);color:white;">${svgIcon(ICON.wifi)} ${m.requireNetwork !== false ? 'Cần đúng IP mạng' : 'Điểm danh từ xa'}</span>
                </div>
                <div style="display:flex; flex-wrap:wrap; gap:1.25rem; font-size:0.85rem; opacity:0.95; position:relative; z-index:1;">
                    <span style="display:inline-flex; align-items:center; gap:5px;">${svgIcon(ICON.clock)} Họp: <strong>${m.startTime} - ${m.endTime}</strong></span>
                    <span style="display:inline-flex; align-items:center; gap:5px;">${svgIcon(ICON.timer)} Điểm danh: ${m.checkInStart} - ${m.checkInClose}</span>
                </div>
                <div style="position:relative; z-index:1;">${actionHtml}</div>
            `;
            return card;
        }

        function mmNormalCard(m, log, kind) {
            const card = document.createElement('div');
            card.className = 'meet-card' + (kind === 'past' ? ' past' : '');

            const now = new Date();
            const end = mmMk(m.date, m.endTime);
            const validLog = mmIsValidCheckIn(log, m) ? log : null;
            let statusHtml;
            if (validLog) {
                statusHtml = mmStatusPill(validLog.status);
            } else if (kind === 'past' && now > end) {
                statusHtml = mmStatusPill('Vắng không phép');
            } else {
                statusHtml = mmStatusPill('Chưa điểm danh');
            }

            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
                    <div>
                        <div class="meet-kicker">${kind === 'past' ? 'Đã diễn ra' : 'Họp sắp tới'}</div>
                        <div class="meet-title">${mmCleanTitle(m)}</div>
                    </div>
                    ${statusHtml}
                </div>
                <div style="display:flex; gap:6px; flex-wrap:wrap;">
                    ${mmTypeBadge(m)}
                    <span class="meet-pill" style="background:#EEF2FF;color:#4338CA;">${svgIcon(ICON.users)} ${mmDeptLabel(m)}</span>
                    ${m.requireNetwork !== false
                        ? `<span class="meet-pill" style="background:#EFF6FF;color:#1D4ED8;" title="Phải kết nối đúng Wifi của cơ sở mới điểm danh được">${svgIcon(ICON.wifi)} Cần đúng IP mạng</span>`
                        : `<span class="meet-pill" style="background:#F3F4F6;color:#6B7280;" title="Có thể điểm danh từ xa">${svgIcon(ICON.wifi)} Điểm danh từ xa</span>`}
                </div>
                <div style="display:flex; flex-direction:column; gap:0.45rem;">
                    <div class="meet-row">${svgIcon(ICON.cal)} <span>${mmFormatDate(m.date)}</span></div>
                    <div class="meet-row">${svgIcon(ICON.clock)} <span>Họp: <strong style="color:var(--text-main);">${m.startTime} - ${m.endTime}</strong></span></div>
                    <div class="meet-row">${svgIcon(ICON.timer)} <span>Điểm danh: ${m.checkInStart} - ${m.checkInClose}</span></div>
                </div>
                ${kind === 'upcoming' ? `<div style="display:flex; flex-direction:column; gap:0.5rem;">
                    ${!validLog ? `<button class="meet-preview-btn" disabled>${svgIcon(ICON.timer)} Điểm danh mở lúc ${m.checkInStart} · ${mmFormatDate(m.date)}</button>` : ''}
                    ${mmRsvpArea(m, log)}
                </div>` : ''}
            `;
            return card;
        }

        function mmTickCountdowns() {
            const now = Date.now();
            document.querySelectorAll('[data-countdown]').forEach(el => {
                const close = Number(el.dataset.close);
                const end = Number(el.dataset.end);
                let target, prefix;
                if (now < close) { target = close; prefix = 'Còn '; }
                else { target = end; prefix = 'Trễ · còn '; }
                let diff = Math.max(0, Math.floor((target - now) / 1000));
                const h = Math.floor(diff / 3600);
                const mi = Math.floor((diff % 3600) / 60);
                const s = diff % 60;
                const txt = h > 0 ? `${h}h${String(mi).padStart(2,'0')}m` : `${mi}:${String(s).padStart(2,'0')}`;
                el.innerHTML = `${svgIcon(ICON.hourglass)} ${prefix}${txt}`;
            });
        }

        // Khu vực RSVP: hiển thị theo trạng thái xác nhận & điểm danh hiện tại.
        // Đã điểm danh (Có/Trễ) -> không cần RSVP. Chưa -> cho xác nhận Đi / Báo vắng.
        function mmRsvpArea(m, log) {
            const attended = log && (log.status === 'Có' || log.status === 'Trễ') && mmIsValidCheckIn(log, m);
            if (attended) return '';
            const rsvp = log && log.rsvp;
            if (rsvp === 'yes') {
                return `<div class="rsvp-box">
                    <div class="rsvp-state yes">${svgIcon(ICON.check || '')}<span>Bạn đã xác nhận THAM GIA cuộc họp</span></div>
                    <button class="rsvp-change" onclick="mmRsvpNo('${m.id}')">Đổi sang báo vắng</button>
                </div>`;
            }
            if (rsvp === 'no') {
                const reason = (log && log.rsvpReason) ? log.rsvpReason : '';
                return `<div class="rsvp-box">
                    <div class="rsvp-state no">${svgIcon(ICON.timer)}<span>Bạn đã BÁO VẮNG (có phép)</span></div>
                    ${reason ? `<div style="font-size:0.76rem;color:var(--text-muted);margin-top:0.35rem;">Lý do: ${mmEsc(reason)}</div>` : ''}
                    <button class="rsvp-change" onclick="mmRsvpYes('${m.id}', null)">Đổi sang xác nhận tham gia</button>
                </div>`;
            }
            return `<div class="rsvp-box">
                <div class="rsvp-q">Bạn có tham gia cuộc họp này không?</div>
                <div class="rsvp-row">
                    <button class="rsvp-btn rsvp-yes" onclick="mmRsvpYes('${m.id}', this)">${svgIcon(ICON.users)} Xác nhận tham gia</button>
                    <button class="rsvp-btn rsvp-no" onclick="mmRsvpNo('${m.id}')">Báo vắng</button>
                </div>
            </div>`;
        }

        function mmEsc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

        window.mmRsvpYes = async function(meetingId, btn) {
            if (btn) { btn.disabled = true; btn.innerHTML = 'Đang lưu...'; }
            try {
                const userName = localStorage.getItem('userFullName') || localStorage.getItem('currentUser') || 'Nhân viên';
                await DBService.selfRsvpMeeting(meetingId, mmUserId, userName, true, '');
                if (typeof UIService !== 'undefined' && UIService.toast) UIService.toast('Đã xác nhận tham gia. Nhớ điểm danh khi tới giờ họp nhé!', 'success');
                await mmLoad();
            } catch (err) { console.error(err); alert('Lỗi: ' + err.message); if (btn) btn.disabled = false; }
        };

        window.mmRsvpNo = function(meetingId) {
            const old = document.getElementById('mm-rsvp-modal');
            if (old) old.remove();
            const overlay = document.createElement('div');
            overlay.id = 'mm-rsvp-modal';
            overlay.className = 'mm-overlay';
            overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
            overlay.innerHTML = `
                <div class="mm-modal">
                    <div class="mm-modal-h">Báo vắng cuộc họp</div>
                    <div class="mm-modal-b">
                        <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:0.6rem;line-height:1.5;">
                            Vui lòng ghi rõ lý do không tham gia. Yêu cầu sẽ được ghi nhận là <strong style="color:#4338CA;">Vắng có phép</strong>.
                        </div>
                        <textarea id="mm-rsvp-reason" rows="3" placeholder="VD: Bận việc gia đình, đi công tác..."></textarea>
                    </div>
                    <div class="mm-modal-f">
                        <button class="mm-cancel" onclick="document.getElementById('mm-rsvp-modal').remove()">Hủy</button>
                        <button class="mm-confirm" onclick="mmRsvpNoConfirm('${meetingId}', this)">Xác nhận báo vắng</button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
            setTimeout(() => { const t = document.getElementById('mm-rsvp-reason'); if (t) t.focus(); }, 50);
        };

        window.mmRsvpNoConfirm = async function(meetingId, btn) {
            const reason = (document.getElementById('mm-rsvp-reason').value || '').trim();
            if (!reason) { alert('Vui lòng ghi rõ lý do vắng.'); return; }
            if (btn) { btn.disabled = true; btn.innerText = 'Đang lưu...'; }
            try {
                const userName = localStorage.getItem('userFullName') || localStorage.getItem('currentUser') || 'Nhân viên';
                await DBService.selfRsvpMeeting(meetingId, mmUserId, userName, false, reason);
                const modal = document.getElementById('mm-rsvp-modal'); if (modal) modal.remove();
                if (typeof UIService !== 'undefined' && UIService.toast) UIService.toast('Đã ghi nhận báo vắng (có phép).', 'success');
                await mmLoad();
            } catch (err) { console.error(err); alert('Lỗi: ' + err.message); if (btn) { btn.disabled = false; btn.innerText = 'Xác nhận báo vắng'; } }
        };

        window.mmCheckIn = async function(meetingId, btn) {
            if (btn) { btn.disabled = true; btn.innerHTML = 'Đang điểm danh...'; }
            try {
                const meeting = await DBService.getMeetingsForMonth(`${mmCurrentDate.getFullYear()}-${String(mmCurrentDate.getMonth()+1).padStart(2,'0')}`)
                    .then(list => list.find(x => x.id === meetingId));
                if (!meeting) {
                    // fallback: đọc trực tiếp
                }
                const now = new Date();
                let mObj = meeting;
                if (!mObj) {
                    if (btn) { btn.disabled = false; }
                    alert('Không tìm thấy cuộc họp.');
                    return;
                }
                const ciStart = mmMk(mObj.date, mObj.checkInStart);
                const ciClose = mmMk(mObj.date, mObj.checkInClose);
                const end = mmMk(mObj.date, mObj.endTime);

                if (now < ciStart) { alert('Chưa tới giờ điểm danh.'); if (btn) btn.disabled = false; return; }
                if (now > end) { alert('Cuộc họp đã kết thúc, không thể điểm danh.'); if (btn) btn.disabled = false; return; }

                // XÁC MINH VỊ TRÍ (giống chấm công) — nói là "IP mạng/Wifi", không lộ GPS.
                // Chỉ kiểm tra khi admin BẬT "Bắt buộc đúng IP mạng" lúc tạo họp.
                // Họp cũ chưa có trường này (undefined) -> mặc định VẪN kiểm tra cho an toàn.
                if (mObj.requireNetwork !== false) {
                    if (btn) btn.innerHTML = 'Đang kiểm tra mạng...';
                    try {
                        await DBService.assertMeetingLocationAllowed();
                    } catch (gpsErr) {
                        alert(gpsErr.message || 'IP Mạng không hợp lệ! Vui lòng kết nối đúng Wifi của cơ sở để điểm danh.');
                        if (btn) { btn.disabled = false; btn.innerHTML = 'Điểm danh ngay'; }
                        return;
                    }
                }
                if (btn) btn.innerHTML = 'Đang điểm danh...';

                const status = now <= ciClose ? 'Có' : 'Trễ';
                const userName = localStorage.getItem('userFullName') || localStorage.getItem('currentUser') || 'Nhân viên';

                await DBService.selfCheckInMeeting(meetingId, mmUserId, userName, status);

                if (typeof UIService !== 'undefined' && UIService.toast) {
                    UIService.toast(`Điểm danh thành công! Trạng thái: ${status === 'Trễ' ? 'Đi trễ' : 'Có mặt'}`, 'success');
                }
                await mmLoad();
            } catch (err) {
                console.error(err);
                alert('Lỗi điểm danh: ' + err.message);
                if (btn) btn.disabled = false;
            }
        };

        window.myMeetChangeMonth = function(offset) {
            mmCurrentDate.setMonth(mmCurrentDate.getMonth() + offset);
            mmUpdateMonthLabel();
            mmLoad();
        };

        // Khởi tạo
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.waitAuth) await window.waitAuth();

            mmUserId = localStorage.getItem('currentUserId');
            if (!mmUserId) {
                // main.js sẽ tự chuyển hướng về login nếu chưa đăng nhập
                return;
            }

            mmUpdateMonthLabel();

            // Xác định chuyên môn của tôi (ưu tiên bản ghi admin đã lưu)
            try {
                const users = await DBService.getUsers();
                const me = users.find(u => u.id === mmUserId);
                let specLabel = '';
                const monthStr = `${mmCurrentDate.getFullYear()}-${String(mmCurrentDate.getMonth()+1).padStart(2,'0')}`;
                try {
                    const logged = await DBService.getMonthlyMeetings(monthStr);
                    if (logged?.records?.[mmUserId]?.chuyen_mon) specLabel = logged.records[mmUserId].chuyen_mon;
                } catch(e) {}
                if (!specLabel && me && window.formatUserSpecialty) specLabel = window.formatUserSpecialty(me);
                mmUserSpecsUpper = (specLabel || '').toUpperCase();
            } catch (e) {
                console.warn('Không xác định được chuyên môn:', e);
            }

            await mmLoad();

            if (window.lucide) window.lucide.createIcons();
        });
    </script>
</body>

</html>
