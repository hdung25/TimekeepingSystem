<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Tiếp Tân - Hệ Thống Chấm Công</title>
    <link rel="icon" type="image/jpg" href="images/TUDUYTRE.jpg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="images/TUDUYTRE.jpg">
    <link rel="stylesheet" href="css/style.css?v=20260731-mobile-card-v2">
    <style>
        /* ========== Branch Tabs ========== */
        .branch-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        .branch-tab {
            padding: 0.5rem 1.5rem;
            border-radius: 999px;
            border: 2px solid var(--border-color);
            background: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .branch-tab.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 2px 8px rgba(5, 150, 105, 0.3);
        }

        .branch-tab:hover:not(.active) {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* ========== Week Picker ========== */
        .week-picker {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            justify-content: center;
        }

        .week-picker button {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .week-picker button:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .week-label {
            font-weight: 700;
            font-size: 1rem;
            text-align: center;
            color: var(--primary-color);
            letter-spacing: 0.5px;
        }

        /* ========== Schedule Table ========== */
        .schedule-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: var(--radius-lg);
        }

        .schedule-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            min-width: 850px;
            table-layout: fixed;
        }

        .schedule-table th,
        .schedule-table td {
            border: 1px solid #E5E7EB;
            padding: 0.75rem 0.5rem;
            text-align: left;
            vertical-align: top;
        }

        .schedule-table th {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
            text-align: center;
            padding: 0.85rem 0.5rem;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .schedule-table th .th-date {
            font-weight: 500;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.75);
        }

        .schedule-table th:first-child {
            width: 185px;
            min-width: 185px;
            border-radius: var(--radius-lg) 0 0 0;
        }

        .schedule-table th:last-child {
            border-radius: 0 var(--radius-lg) 0 0;
        }

        /* Shift label cell (first column) */
        .shift-label-cell {
            background: #F0FDF4 !important;
            text-align: center !important;
            vertical-align: middle !important;
            padding: 0.6rem 0.4rem !important;
        }

        .shift-name {
            font-weight: 800;
            font-size: 0.9rem;
            color: var(--primary-color);
            margin-bottom: 0.35rem;
            letter-spacing: 1px;
        }

        .shift-time-display {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .shift-time-inputs {
            display: flex;
            align-items: center;
            gap: 3px;
            justify-content: center;
            margin-top: 4px;
        }

        .shift-time-inputs input.time-text {
            width: 50px;
            padding: 3px 2px;
            border: 1px solid #D1D5DB;
            border-radius: 5px;
            font-size: 0.82rem;
            font-family: 'Segoe UI', system-ui, sans-serif;
            text-align: center;
            background: white;
            color: #1F2937;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .shift-time-inputs input.time-text:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.2);
        }

        .shift-dash {
            font-size: 0.85rem;
            color: #6B7280;
            font-weight: 600;
        }

        /* Day cells */
        .day-cell {
            min-height: 70px;
            transition: background 0.15s ease;
        }

        .day-cell.editable {
            cursor: pointer;
        }

        .day-cell.editable:hover {
            background: #F0F9FF;
        }

        .empty-cell {
            color: #D1D5DB;
            font-size: 0.8rem;
        }

        /* Staff tags in table */
        .staff-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 600;
            margin: 2px 1px;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }

        .staff-note {
            display: block;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-style: italic;
            line-height: 1.3;
        }

        /* ========== Cell Modal ========== */
        .cell-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(2px);
        }

        .cell-modal.open {
            display: flex;
        }

        .cell-modal-content {
            background: white;
            padding: 1.75rem;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 420px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            animation: modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(-10px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .staff-checkbox-list {
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid #F3F4F6;
            border-radius: var(--radius-md);
        }

        .staff-checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.65rem 0.75rem;
            border-bottom: 1px solid #F9FAFB;
            cursor: pointer;
            transition: background 0.12s;
        }

        .staff-checkbox-item:last-child {
            border-bottom: none;
        }

        .staff-checkbox-item:hover {
            background: #F0FDF4;
        }

        .staff-checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        .staff-color-dot {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.75rem;
        }

        .staff-pick-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .note-input {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            margin-top: 1rem;
        }

        .note-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.15);
        }

        /* ========== Responsive ========== */
        @media (max-width: 768px) {
            .week-picker {
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .week-label {
                font-size: 0.8rem;
                order: -1;
                width: 100%;
            }

            .branch-tabs {
                justify-content: center;
            }

            .branch-tab {
                padding: 0.4rem 1rem;
                font-size: 0.82rem;
            }

            /* Page header — stack title + button */
            .page-header {
                flex-direction: column !important;
                align-items: flex-start !important;
                gap: 0.75rem !important;
            }

            .page-header h1 {
                font-size: 1.2rem !important;
            }

            #save-area .btn {
                width: 100%;
                font-size: 0.88rem !important;
                padding: 0.55rem 1rem !important;
            }

            /* Schedule Table — compact for mobile */
            .schedule-table {
                min-width: 700px;
            }

            .schedule-table th,
            .schedule-table td {
                padding: 0.5rem 0.35rem;
                font-size: 0.78rem;
            }

            .schedule-table th:first-child {
                width: 120px !important;
                min-width: 120px !important;
            }

            .shift-name {
                font-size: 0.78rem;
                margin-bottom: 0.2rem;
            }

            .shift-time-inputs {
                gap: 2px;
            }

            .shift-time-inputs input.time-text {
                width: 42px;
                font-size: 0.72rem;
                padding: 2px 1px;
            }

            .shift-time-display {
                font-size: 0.68rem;
            }

            .shift-dash {
                font-size: 0.72rem;
            }

            .staff-tag {
                font-size: 0.7rem;
                padding: 3px 6px;
            }

            .day-cell {
                min-height: 50px;
            }

            /* Modal — full width on mobile */
            .cell-modal-content {
                margin: 1rem;
                padding: 1.25rem;
                max-width: calc(100% - 2rem);
                max-height: 85vh;
            }

            .staff-checkbox-item {
                padding: 0.55rem 0.6rem;
                gap: 0.5rem;
            }

            .staff-color-dot {
                width: 24px;
                height: 24px;
                font-size: 0.7rem;
            }

            .staff-pick-name {
                font-size: 0.82rem;
            }

            .note-input {
                font-size: 0.82rem;
                padding: 0.5rem 0.6rem;
            }
        }
    </style>
    <!-- Firebase SDK (Compat) -->
    <script src='https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js'></script>
    <script src='https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js'></script>
    <script src='https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js'></script>

    <!-- App Config -->
    <script src='js/firebase-config.js'></script>
    <script src='js/db-service.js?v=20260805-trust-multiselect-v1'></script>
    <script src='js/ui-service.js?v=20260803-early10-v1'></script>
    <script src='js/auth-guard.js?v=20260725-admin-edit-fix-v1'></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <img src="images/TUDUYTRE.jpg" alt="Logo"
                    style="height: 40px; margin-right: 0.5rem; border-radius: 4px;">
                <span style="font-size: 0.9rem; font-weight: 700;">NGOẠI NGỮ & TOÁN TƯ DUY TRẺ</span>
            </div>
            <nav id="sidebar-nav"></nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header" style="margin-bottom: 1.5rem;">
                <div>
                    <h1 style="font-size: 1.5rem; font-weight: 700;"><i data-lucide="clipboard"></i> Lịch Tiếp Tân</h1>
                    <p style="color: var(--text-muted); margin-top: 0.25rem;">Quản lý lịch trực tiếp tân theo tuần</p>
                </div>
                <div id="save-area" style="display:none; gap: 0.5rem; flex-wrap: wrap;">
                    <button id="btn-mark-fixed" class="btn" onclick="toggleScheduleFixedShiftMode()"
                        style="font-size:0.95rem; padding:0.6rem 1.25rem; background:#E0E7FF; color:#4F46E5; border:1px solid #C7D2FE; font-weight:600;">
                        <i data-lucide="star"></i> Đánh dấu Ca Cố Định
                    </button>
                    <button class="btn" onclick="clearCurrentWeek()"
                        style="font-size:0.95rem; padding:0.6rem 1.25rem; background:#FEE2E2; color:#DC2626; border:1px solid #FECACA; font-weight:600;">
                        <i data-lucide="trash-2"></i> Xóa Lịch
                    </button>
                    <button class="btn btn-primary" onclick="saveFullWeek()"
                        style="font-size:0.95rem; padding:0.6rem 1.5rem;">
                        <i data-lucide="save"></i> Lưu Lịch Tuần
                    </button>
                </div>
            </header>

            <!-- Branch Tabs -->
            <div class="branch-tabs">
                <button class="branch-tab active" onclick="switchBranch('cs1')" id="tab-cs1">📍 Cơ Sở 1</button>
                <button class="branch-tab" onclick="switchBranch('cs2')" id="tab-cs2">📍 Cơ Sở 2</button>
                <button class="branch-tab" onclick="switchBranch('cs3')" id="tab-cs3">📍 Cơ Sở 3</button>
            </div>

            <!-- Week Picker -->
            <div class="week-picker">
                <button onclick="navigateWeek(-1)" title="Tuần trước">◀</button>
                <span class="week-label" id="week-label">Đang tải...</span>
                <button onclick="navigateWeek(1)" title="Tuần sau">▶</button>
            </div>

            <!-- Inheritance Banner (hidden by default) -->
            <div id="inherit-banner"
                style="display: none; background: linear-gradient(135deg, #FEF3C7, #FDE68A); border: 1px solid #F59E0B; border-radius: 0.75rem; padding: 1rem 1.25rem; margin-bottom: 1rem; display: none;">
                <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
                    <span style="font-size: 1.25rem;"><i data-lucide="clipboard"></i></span>
                    <div style="flex: 1; min-width: 200px;">
                        <strong style="color: #92400E;">Lịch kế thừa</strong>
                        <p id="inherit-banner-text" style="font-size: 0.85rem; color: #78350F; margin: 0.25rem 0 0;">
                            Lịch này được copy từ tuần trước. Bấm Xác Nhận để áp dụng cho tuần này.</p>
                    </div>
                    <button class="btn btn-primary" onclick="confirmInheritedSchedule()" style="white-space: nowrap;">
                        <i data-lucide="check-circle"></i> Xác Nhận Lịch Tuần Này
                    </button>
                </div>
            </div>

            <!-- Schedule Table -->
            <div class="glass-panel" style="padding: 0; overflow: hidden;">
                <div class="schedule-wrapper">
                    <table class="schedule-table" id="schedule-table">
                        <thead>
                            <tr>
                                <th>CA</th>
                                <th>Thứ 2</th>
                                <th>Thứ 3</th>
                                <th>Thứ 4</th>
                                <th>Thứ 5</th>
                                <th>Thứ 6</th>
                                <th>Thứ 7</th>
                                <th>Chủ Nhật</th>
                            </tr>
                        </thead>
                        <tbody id="schedule-body">
                            <!-- Rendered by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Cell Edit Modal -->
    <div class="cell-modal" id="cell-modal">
        <div class="cell-modal-content">
            <h3 id="cell-modal-title"
                style="margin-bottom: 1.25rem; color: var(--primary-color); font-size: 1.05rem; font-weight: 700;"></h3>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.75rem;">Chọn nhân viên tiếp tân cho
                ca này:</p>
            <input type="text" id="modal-staff-search" class="list-search-input" placeholder="Tìm tiếp tân..."
                oninput="filterModalStaff(this.value)" style="margin-bottom: 0.5rem;">
            <div class="staff-checkbox-list" id="staff-checkbox-list">
                <!-- Populated by JS -->
            </div>
            <input type="text" class="note-input" id="cell-note-input"
                placeholder="📝 Ghi chú (VD: phân công công việc tuần)...">
            <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
                <button class="btn"
                    style="background: var(--border-color); color: var(--text-main); padding: 0.6rem 1.25rem;"
                    onclick="closeCellModal()">Hủy</button>
                <button class="btn btn-primary" style="flex: 1; padding: 0.6rem;" onclick="saveCellData()"><i data-lucide="check-circle"></i> Xác
                    nhận</button>
            </div>
        </div>
    </div>

    <script src="js/main.js?v=20260805-trust-multiselect-v1"></script>
    <script src="js/receptionist-schedule.js?v=20260628-gps-receptionist-persistence"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        });
    </script>
</body>

</html>
