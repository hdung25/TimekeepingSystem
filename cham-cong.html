<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chấm Công - Hệ Thống Chấm Công</title>
    <link rel="icon" type="image/jpg" href="images/TUDUYTRE.jpg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="images/TUDUYTRE.jpg">
    <link rel="stylesheet" href="css/style.css?v=20260925-landscape-v1"> <link rel="stylesheet" href="css/app-ui.css?v=20260926-mobile-ui-v1">
    <style>
        .page-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .history-table th,
        .history-table td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .history-table th {
            color: var(--text-muted);
            font-weight: 500;
        }
    </style>
    <script src="js/startup-recovery.js?v=20260906-early10-recovery-v1"></script>
    <!-- Firebase SDK (Compat) -->
    <script src='https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js'></script>
    <script src='https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js'></script>
    <script src='https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js'></script>

    <!-- App Config -->
    <script src='js/firebase-config.js?v=20260926-mobile-ui-v1'></script>
    <script src='js/teacher-shift-state.js?v=20260906-early10-recovery-v1'></script>
    <script src='js/db-service.js?v=20260923-fast-login-v2'></script>
    <script src='js/shift-absence-state.js?v=20260906-early10-recovery-v1'></script>
    <script async src="https://unpkg.com/lucide@1.45.0/dist/umd/lucide.min.js"></script>
</head>

<body>
    <div class="admin-container">
        <!-- Sidebar (Reused) -->
        <aside class="sidebar">
            <div class="logo-area">
                <img src="images/TUDUYTRE.jpg" alt="Logo"
                    style="height: 40px; margin-right: 0.5rem; border-radius: 4px;">
                <span style="font-size: 0.9rem; font-weight: 700;">NGOẠI NGỮ & TOÁN TƯ DUY TRẺ</span>
            </div>

            <nav id="sidebar-nav">
                <!-- Content handled by main.js -->
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content tk-page" id="timekeeping-container">
            <div class="page-header tk-header">
                <div>
                    <h1 class="tk-title">Chấm Công Hôm Nay</h1>
                    <p class="tk-date" id="today-date-display">...</p>
                </div>
                <div>
                    <div class="tk-clock" id="live-clock" data-format="time">--:--</div>
                </div>
            </div>

            <div class="tk-layout">

                <!-- LEFT COLUMN: Global Check-in -->
                <div class="tk-main">
                    <!-- Meeting Banner Container -->
                    <div id="meeting-banner-container" style="margin-bottom: 1rem; display: none;"></div>

                    <!-- Global Check-in Button -->
                    <section id="global-checkin-container" class="tk-checkin">
                        <!-- Populated by JS -->
                    </section>

                    <section class="tk-section">
                        <div class="tk-section-head">
                            <h2>Trạng Thái Lớp Hôm Nay</h2>
                        </div>
                        <!-- Chips Container -->
                        <div id="chips-container" class="tk-chips">
                            <!-- Populated by JS - Shows chip status for today's classes -->
                        </div>
                    </section>

                    <section class="tk-section">
                        <div class="tk-section-head">
                            <h2>Danh Sách Lớp Dạy</h2>
                            <p>Bấm <strong>"Nhận Lớp"</strong> nếu hôm nay bạn có dạy lớp này.</p>
                        </div>
                        <!-- Class List Container -->
                        <div id="class-list-container">
                            <!-- Populated by JS -->
                        </div>
                    </section>
                </div>

                <!-- RIGHT COLUMN: Today's History -->
                <aside class="glass-panel tk-side">
                    <h3><svg class="ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>Lịch sử Vào/Ra hôm nay</h3>
                    <div id="attendance-history-list">
                        <!-- Populated by JS -->
                    </div>
                </aside>
            </div>

        </main>
    </div>

    <script>
        // Set date immediately
        const d = new Date();
        const weekday = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'][d.getDay()];
        document.getElementById('today-date-display').innerText = `${weekday}, ${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
    </script>
    <script src="js/ui-service.js?v=20260912-schedule-blank-guard-v1"></script>
    <script src="js/main.js?v=20260926-mobile-ui-v1"></script>
    <script src="js/admin-payroll-override.js?v=20260906-early10-recovery-v1"></script>
    <script src="js/evaluation-service.js?v=20260914-autoclose-subject-v1"></script>
    <script src="js/timekeeping.js?v=20260926-mobile-ui-v1"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" })}</script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        });
    </script>
</body>

</html>
