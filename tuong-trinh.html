<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tường Trình - Hệ Thống Chấm Công</title>
    <link rel="icon" type="image/jpg" href="images/TUDUYTRE.jpg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <script src='https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js'></script>
    <script src='https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js'></script>
    <script src='https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js'></script>
    <script src='js/firebase-config.js'></script>
    <script src='js/auth-guard.js?v=20260725-admin-edit-fix-v1'></script>
    <script src='js/db-service.js?v=20260819-absence-recovery-v1'></script>
    <script src='js/evaluation-service.js?v=20260819-absence-recovery-v1'></script>
    <script src='js/ui-service.js?v=20260807-tuong-trinh-v2'></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root{--p:#059669;--p-d:#047857;--p-s:#ECFDF5;--ink:#111827;--mut:#6B7280;--ln:#E5E7EB;--bg:#F1F5F9;
              --warn:#F59E0B;--warn-s:#FFFBEB;--info:#3B82F6;--info-s:#EFF6FF;--dan:#EF4444;--dan-s:#FEE2E2;
              --primary-color:#059669;--secondary-color:#F59E0B;--bg-surface:#ffffff;--text-muted:#6B7280;
              --radius-md:12px;--radius-lg:16px;
              --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
              --shadow-xl:0 20px 25px -5px rgba(0,0,0,.1),0 10px 10px -5px rgba(0,0,0,.04);}
        *{box-sizing:border-box;margin:0}
        body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
        button{font-family:inherit}

        /* ---------- Thanh trên ---------- */
        .top{background:white;border-bottom:1px solid var(--ln);padding:.7rem 1rem;display:flex;align-items:center;gap:.7rem;position:sticky;top:0;z-index:60}
        .top a.back{display:inline-flex;align-items:center;gap:4px;color:var(--mut);text-decoration:none;font-size:.85rem;font-weight:600;padding:7px 11px;border-radius:9px}
        .top a.back:hover{background:var(--p-s);color:var(--p)}
        .top h1{font-size:1.02rem;font-weight:800;color:var(--p-d)}
        .top .sp{flex:1}
        .icon-btn{background:white;border:1.5px solid var(--ln);border-radius:9px;padding:7px 11px;cursor:pointer;color:var(--mut);font-weight:600;font-size:.82rem;display:inline-flex;align-items:center;gap:5px}
        .icon-btn:hover{border-color:var(--p);color:var(--p)}

        .wrap{max-width:1360px;margin:0 auto;padding:.9rem 1rem 1.5rem}

        /* ---------- Tabs ---------- */
        .tabs{display:flex;gap:8px;margin-bottom:.7rem;flex-wrap:wrap}
        .tab{padding:.5rem 1rem;border-radius:99px;border:1.5px solid var(--ln);background:white;cursor:pointer;font-weight:700;font-size:.85rem;color:var(--mut);display:inline-flex;align-items:center;gap:6px}
        .tab:hover{border-color:var(--p)}
        .tab.on{background:var(--p);border-color:var(--p);color:white}
        .cnt{background:rgba(0,0,0,.08);padding:1px 7px;border-radius:99px;font-size:.72rem}
        .tab.on .cnt{background:rgba(255,255,255,.25)}

        /* ---------- Bộ lọc ---------- */
        .fbar{background:white;border:1px solid var(--ln);border-radius:14px;padding:.7rem .8rem;margin-bottom:.8rem;box-shadow:0 1px 4px rgba(0,0,0,.03)}
        .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:.6rem}
        .chip{border:1.5px solid var(--ln);background:white;border-radius:99px;padding:.34rem .8rem;font-size:.78rem;font-weight:700;color:#374151;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
        .chip:hover{border-color:#9CA3AF}
        .chip b{font-weight:800}
        .chip.on{color:white}
        .chip.c-bad.on{background:var(--dan);border-color:var(--dan)}
        .chip.c-miss.on{background:#DB2777;border-color:#DB2777}
        .chip.c-extra.on{background:var(--warn);border-color:var(--warn)}
        .chip.c-ok.on{background:var(--p);border-color:var(--p)}
        .chip.c-auto.on{background:#4338CA;border-color:#4338CA}
        .chip.c-old.on{background:#B91C1C;border-color:#B91C1C}
        .chip .dotn{background:#F3F4F6;color:#4B5563;border-radius:99px;padding:0 6px;font-size:.7rem;font-weight:800}
        .chip.on .dotn{background:rgba(255,255,255,.25);color:white}
        .fgrid{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
        .fgrid select,.fgrid input[type=text]{padding:.44rem .6rem;border:1.5px solid var(--ln);border-radius:9px;font-size:.83rem;font-family:inherit;background:white;color:var(--ink);min-height:38px}
        .fgrid select:focus,.fgrid input:focus{outline:none;border-color:var(--p)}
        .fgrid .search{flex:1;min-width:170px}
        .lnk{background:none;border:none;color:var(--mut);font-size:.8rem;font-weight:700;cursor:pointer;text-decoration:underline;padding:.4rem .3rem}
        .lnk:hover{color:var(--dan)}

        .banner{border-radius:12px;padding:.6rem .8rem;font-size:.82rem;line-height:1.5;margin-bottom:.8rem;display:flex;gap:8px;align-items:flex-start}
        .bn-warn{background:var(--warn-s);border:1px solid #FDE68A;color:#92400E}
        .bn-ok{background:var(--p-s);border:1px solid #A7F3D0;color:#065F46}
        .banner .grow{flex:1;min-width:0}

        /* ---------- Bố cục 2 khung ---------- */
        .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:.9rem;align-items:start}
        .card{background:white;border:1px solid var(--ln);border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.03);overflow:hidden}
        .lhead{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.6rem .8rem;border-bottom:1px solid var(--ln);background:#F9FAFB;flex-wrap:wrap}
        .lhead .n{font-size:.8rem;font-weight:800;color:#374151}
        .lhead select{padding:.35rem .5rem;border:1.5px solid var(--ln);border-radius:8px;font-size:.78rem;font-family:inherit;background:white;min-height:34px}
        .lhead label.all{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;color:var(--mut);cursor:pointer;user-select:none}
        .rows{max-height:calc(100vh - 330px);overflow-y:auto;padding:.4rem}
        .dsep{position:sticky;top:0;background:linear-gradient(#fff,#fff 70%,rgba(255,255,255,.85));padding:.5rem .5rem .3rem;font-size:.76rem;font-weight:800;color:#1F2937;display:flex;align-items:center;gap:7px;z-index:2}
        .dsep .pill{background:#EEF2FF;color:#3730A3;border-radius:99px;padding:1px 8px;font-size:.7rem;font-weight:800}
        .dsep .pill.old{background:#FEE2E2;color:#991B1B}

        .row{display:flex;align-items:center;gap:.6rem;padding:.55rem .55rem;border:1.5px solid transparent;border-radius:11px;cursor:pointer}
        .row:hover{background:#F8FAFC}
        .row.sel{border-color:var(--p);background:var(--p-s)}
        .row input[type=checkbox]{width:17px;height:17px;cursor:pointer;accent-color:var(--p)}
        /* Bọc ô tick trong <label> để cả vùng quanh nó cũng bấm được (ngón tay trên điện thoại) */
        .ckwrap{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
        .row .st{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .st-ok{background:var(--p-s);color:var(--p-d)}
        .st-warn{background:var(--warn-s);color:#92400E}
        .st-bad{background:var(--dan-s);color:#991B1B}
        .st-miss{background:#FCE7F3;color:#9D174D}
        .st-none{background:#F3F4F6;color:#6B7280}
        .row .mid{flex:1;min-width:0}
        .row .r1{display:flex;align-items:baseline;gap:6px;min-width:0}
        .row .who{font-weight:700;font-size:.87rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .row .r2{font-size:.75rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
        .row .tm{font-weight:800;font-size:.8rem;color:#1F2937;white-space:nowrap;flex-shrink:0}
        .bdg{font-size:.66rem;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap;flex-shrink:0}
        .b-s{background:var(--p-s);color:var(--p-d)}.b-e{background:var(--warn-s);color:#92400E}
        .b-i{background:var(--info-s);color:#1E40AF}.b-r{background:var(--dan-s);color:#991B1B}
        .b-a{background:#EDE9FE;color:#5B21B6}.b-n{background:#F3F4F6;color:#4B5563}

        .bulkbar{border-top:1px solid var(--ln);background:#F9FAFB;padding:.65rem .8rem;display:flex;gap:.55rem;align-items:center;flex-wrap:wrap}
        .bulkbar .txt{font-size:.82rem;font-weight:700;color:#374151;flex:1;min-width:120px}

        /* ---------- Khung chi tiết ---------- */
        /* Máy tính: khung dính theo màn hình, tự cuộn bên trong → nút Duyệt luôn thấy được,
           không phải cuộn cả trang xuống mới bấm. Điện thoại đổi thành bảng trượt (dưới). */
        .pane-detail{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}
        .dhead{padding:.8rem 1rem;border-bottom:1px solid var(--ln);background:#F9FAFB;display:flex;justify-content:space-between;gap:.7rem;align-items:flex-start}
        .dhead .nm{font-weight:800;font-size:1rem}
        .dhead .sb{font-size:.78rem;color:var(--mut);margin-top:2px}
        .dbody{padding:.85rem 1rem 1rem}
        .vd{border-radius:11px;padding:.65rem .8rem;font-size:.82rem;line-height:1.55;margin-bottom:.8rem;display:flex;gap:9px;align-items:flex-start}
        .vd b{font-weight:800}
        .vd-ok{background:var(--p-s);color:#065F46;border:1px solid #A7F3D0}
        .vd-warn{background:var(--warn-s);color:#92400E;border:1px solid #FDE68A}
        .vd-bad{background:var(--dan-s);color:#991B1B;border:1px solid #FCA5A5}
        .vd-miss{background:#FCE7F3;color:#9D174D;border:1px solid #FBCFE8}
        .kv{width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:.85rem}
        .kv td{padding:.42rem .3rem;border-bottom:1px solid #F3F4F6;vertical-align:top}
        .kv td.k{width:118px;color:var(--mut);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
        .kv td.v{font-weight:600;color:#111827}
        .kv tr:last-child td{border-bottom:none}
        .miss{background:var(--dan-s);color:#991B1B;font-weight:800;padding:1px 7px;border-radius:6px;font-size:.75rem}
        .why{background:#F9FAFB;border:1px solid var(--ln);border-radius:10px;padding:.55rem .75rem;font-size:.83rem;color:#374151;line-height:1.55}
        .sec-t{font-size:.74rem;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:.9rem 0 .45rem}
        .radios{display:flex;flex-direction:column;gap:.45rem}
        .ropt{display:flex;gap:9px;align-items:flex-start;border:1.5px solid var(--ln);border-radius:11px;padding:.6rem .7rem;cursor:pointer;font-size:.83rem;line-height:1.45}
        .ropt:hover{border-color:#9CA3AF}
        .ropt.on{border-color:var(--p);background:var(--p-s)}
        .ropt input{margin-top:2px;accent-color:var(--p);width:16px;height:16px;flex-shrink:0}
        .ropt .t{font-weight:700}
        .ropt .h{color:var(--mut);font-size:.76rem;margin-top:1px}
        .ropt .sug{background:#DBEAFE;color:#1E40AF;border-radius:99px;padding:0 7px;font-size:.66rem;font-weight:800;margin-left:5px}

        .acts{display:flex;gap:.55rem;flex-wrap:wrap;margin-top:1rem}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;border:none;cursor:pointer;font-weight:700;padding:.6rem 1.1rem;font-size:.85rem;min-height:42px}
        .btn:disabled{opacity:.45;cursor:not-allowed}
        .b-ok{background:var(--p);color:white}.b-ok:not(:disabled):hover{background:var(--p-d)}
        .b-no{background:white;color:#991B1B;border:1.5px solid #FCA5A5}.b-no:not(:disabled):hover{background:var(--dan-s)}
        .b-fix{background:#4338CA;color:white}.b-fix:not(:disabled):hover{filter:brightness(1.1)}
        .b-ghost{background:white;color:#374151;border:1.5px solid var(--ln)}.b-ghost:hover{border-color:#9CA3AF}
        .b-quick{background:linear-gradient(135deg,#6366F1,#4338CA);color:white}
        .b-quick:not(:disabled):hover{filter:brightness(1.1)}

        .fform{border:1.5px dashed #FBCFE8;background:#FFF7FB;border-radius:12px;padding:.75rem .8rem;margin-top:.6rem}
        .fform .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.6rem}
        .fform label{display:block;font-size:.7rem;font-weight:800;color:#9D174D;text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px}
        .fform input,.fform select,.fform textarea{width:100%;padding:.45rem .55rem;border:1.5px solid #F9A8D4;border-radius:9px;font-size:.85rem;font-family:inherit;background:white;min-height:38px}
        .fform input:focus,.fform select:focus,.fform textarea:focus{outline:none;border-color:#DB2777}

        .empty{text-align:center;color:var(--mut);padding:2.4rem 1rem}
        .empty i{width:34px;height:34px;color:#D1D5DB;margin-bottom:.55rem}
        .empty .t{font-weight:700;color:#374151}
        .empty .s{font-size:.82rem;margin-top:3px}

        /* ---------- Toast + modal (dùng chung UIService) ---------- */
        .toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none}
        .toast{pointer-events:auto;min-width:280px;max-width:400px;padding:.9rem 1rem;background:white;border-left:4px solid var(--p);box-shadow:var(--shadow-lg);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:space-between;animation:slideIn .3s ease forwards;opacity:0;transform:translateX(100%);font-size:.88rem}
        .toast.success{border-color:var(--p)}.toast.error{border-color:var(--dan)}
        .toast.warning{border-color:var(--warn)}.toast.info{border-color:var(--info)}
        @keyframes slideIn{to{opacity:1;transform:translateX(0)}}
        @keyframes fadeOut{to{opacity:0;transform:translateX(100%)}}
        .custom-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(2px);z-index:10000;display:flex;align-items:center;justify-content:center;padding:1rem;animation:fadeIn .18s ease forwards}
        .custom-modal-box{background:white;padding:1.6rem;border-radius:var(--radius-lg);width:100%;max-width:400px;box-shadow:var(--shadow-xl);text-align:center;transform:scale(.94);animation:popIn .18s ease forwards;max-height:92vh;overflow-y:auto}
        .custom-modal-actions{margin-top:1.2rem;display:flex;justify-content:center;gap:.8rem}
        .custom-modal-actions .btn{flex:1}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes popIn{to{transform:scale(1)}}
        .animate-spin{animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        /* modal rộng cho hộp chọn tháng trả / từ chối / bổ sung */
        .tt-modal .custom-modal-box{max-width:560px;text-align:left}
        .tt-modal h3{font-size:1.02rem;font-weight:800;color:var(--p-d);margin-bottom:.3rem}
        .tt-modal .sub{font-size:.82rem;color:var(--mut);line-height:1.55;margin-bottom:.9rem}
        .tt-modal textarea{width:100%;padding:.55rem .65rem;border:1.5px solid var(--ln);border-radius:10px;font-family:inherit;font-size:.88rem;min-height:74px}
        .tt-modal textarea:focus{outline:none;border-color:var(--p)}
        .qr{display:flex;gap:6px;flex-wrap:wrap;margin:.5rem 0 .2rem}
        .qr button{background:#F3F4F6;border:1.5px solid var(--ln);border-radius:99px;padding:.3rem .7rem;font-size:.76rem;font-weight:700;color:#374151;cursor:pointer}
        .qr button:hover{border-color:var(--p);color:var(--p-d)}

        /* ---------- Điện thoại / máy tính bảng ---------- */
        .sheet-close{display:none}
        @media(max-width:1024px){
            .split{grid-template-columns:1fr}
            .rows{max-height:none}
            .pane-detail{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:86vh;overflow-y:auto;z-index:200;
                border-radius:18px 18px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.22);transform:translateY(110%);
                transition:transform .24s ease;border:none;border-top:1px solid var(--ln)}
            .pane-detail.open{transform:translateY(0)}
            .pane-detail .dhead{position:sticky;top:0;z-index:3}
            .sheet-close{display:inline-flex}
            .sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:190;opacity:0;pointer-events:none;transition:opacity .2s}
            .sheet-mask.open{opacity:1;pointer-events:auto}
            .bulkbar{position:sticky;bottom:0;z-index:5}
        }
        /* Vùng bấm trên điện thoại: tối thiểu 42px và cách nhau ≥10px cho dễ bấm bằng ngón tay */
        @media(hover:none),(max-width:640px){
            .tab{padding:.62rem 1.05rem;min-height:44px}
            .chip{padding:.55rem .9rem;min-height:42px}
            .lnk{min-height:42px;padding:.5rem .7rem}
            .icon-btn{min-height:42px;padding:.55rem .8rem}
            .lhead select{min-height:44px;padding:.5rem .6rem}
            .fgrid select,.fgrid input[type=text]{min-height:44px}
            .top a.back{min-height:44px}
            .banner .btn{min-height:44px !important;padding:.55rem .9rem !important}
            .chips{gap:10px}
            .fgrid{gap:.6rem}
            .acts{gap:.7rem}
            .bulkbar{gap:.7rem}
            /* Ô tick trong danh sách: <label> bọc ngoài nới vùng bấm lên 44px, bố cục không lệch */
            .row{padding:.7rem .5rem;gap:.5rem}
            .ckwrap{width:44px;height:44px;margin:-11px -10px}
            .row input[type=checkbox]{width:22px;height:22px}
            .lhead label.all input[type=checkbox]{width:22px;height:22px}
            .lhead label.all{min-height:44px}
        }
        @media(max-width:560px){
            .wrap{padding:.7rem .7rem 1.2rem}
            .fgrid select,.fgrid input[type=text]{flex:1 1 46%;min-width:0}
            .fgrid .search{flex:1 1 100%}
            .acts .btn{flex:1 1 46%}
            .bulkbar .btn{flex:1 1 46%}
            .bulkbar .txt{flex:1 1 100%}
            .kv td.k{width:96px;font-size:.72rem}
            .toast-container{left:.7rem;right:.7rem;top:.7rem}
            .toast{min-width:0;max-width:none;width:100%}
            .custom-modal-box{padding:1.2rem}
            .custom-modal-actions{flex-direction:column-reverse;gap:.6rem}
        }
    </style>
</head>
<body>
    <div class="top">
        <a class="back" href="admin.html"><i data-lucide="arrow-left" style="width:16px;height:16px"></i> Quản Lý</a>
        <h1>Tường Trình Chấm Công Bù</h1>
        <div class="sp"></div>
        <button class="icon-btn" onclick="loadTab(curTab)" title="Tải lại danh sách"><i data-lucide="refresh-cw" style="width:15px;height:15px"></i> Tải lại</button>
    </div>

    <div class="wrap">
        <div class="tabs">
            <button class="tab on" id="t-pending" onclick="loadTab('pending')"><i data-lucide="inbox" style="width:15px;height:15px"></i> Chờ duyệt <span class="cnt" id="c-pending">0</span></button>
            <button class="tab" id="t-approved" onclick="loadTab('approved')"><i data-lucide="check-circle" style="width:15px;height:15px"></i> Đã duyệt</button>
            <button class="tab" id="t-rejected" onclick="loadTab('rejected')"><i data-lucide="x-circle" style="width:15px;height:15px"></i> Từ chối</button>
        </div>

        <div class="fbar">
            <div class="chips" id="chips"></div>
            <div class="fgrid">
                <select id="f-month" onchange="setFilter('month',this.value)"></select>
                <select id="f-staff" onchange="setFilter('staff',this.value)"></select>
                <select id="f-branch" onchange="setFilter('branch',this.value)">
                    <option value="">Mọi cơ sở</option><option value="cs1">CS1</option>
                    <option value="cs2">CS2</option><option value="cs3">CS3</option>
                    <option value="__none">Chưa khai cơ sở</option>
                </select>
                <select id="f-kind" onchange="setFilter('kind',this.value)">
                    <option value="">Mọi loại ca</option><option value="gv">Ca dạy (GV/TG)</option>
                    <option value="tt">Ca tiếp tân</option><option value="absent">Ghi nhận vắng</option>
                </select>
                <select id="f-trust" onchange="setFilter('trust',this.value)">
                    <option value="">Mọi diện</option><option value="trusted">Diện tin tưởng</option>
                    <option value="untrusted">Chưa xếp diện</option>
                </select>
                <select id="f-payout" onchange="setFilter('payout',this.value)">
                    <option value="">Mọi tháng trả</option><option value="in">Đoán: trả trong tháng</option>
                    <option value="next">Đoán: trả tháng sau</option>
                </select>

                    <option value="">Mọi ca</option><option value="b10">Có xin Sớm 10p</option>
                    <option value="ot">Có Tăng ca</option><option value="none">Không phát sinh tiền</option>

                    <select id="sortMode" onchange="setSort(this.value)" title="Thứ tự xử lý">
                        <option value="shiftAsc">Ngày ca cũ nhất trước</option>
                        <option value="shiftDesc">Ngày ca mới nhất trước</option>
                        <option value="createdDesc">Mới gửi trước</option>
                    </select>

                <div class="rows" id="rows"><div class="empty">Đang tải...</div></div>

            </div>
            <div class="card pane-detail" id="detail"></div>
        </div>
    </div>
    <div class="sheet-mask" id="sheet-mask" onclick="closeDetail()"></div>

<script>
/* =========================================================================
   TRANG TƯỜNG TRÌNH — thiết kế lại 07/08/2026
   - Danh sách gọn 1 dòng / yêu cầu, sắp theo NGÀY CA cần xử lý (cũ nhất trước)
   - Bộ lọc 8 chiều + chip lọc nhanh có kèm số lượng thật
   - Khung chi tiết: bảng trường thông tin (thay đoạn văn), chọn THÁNG TRẢ bằng radio
   - Thiếu trường bắt buộc  →  KHÔNG cho duyệt, phải "Bổ sung thông tin" trước
   - Duyệt nhiều mục bằng tick, hoặc "Duyệt nhanh" các mục máy đã kiểm chứng đủ 8 điều kiện
   - Bỏ hết alert/confirm/prompt của trình duyệt, dùng UIService
   ========================================================================= */
let curTab='pending',curReqs=[],curVerdicts={},truncated=false;
let filters={quick:'',month:'',staff:'',branch:'',kind:'',trust:'',payout:'',extra:'',q:''};
let sortMode='shiftAsc',selected=new Set(),activeId=null,subjectsCache=[];

const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const adminName=()=>localStorage.getItem('userFullName')||localStorage.getItem('currentUser')||'Admin';
const ft=i=>i?new Date(i).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}):'--:--';
const DOW=['CN','T2','T3','T4','T5','T6','T7'];
const SHIFT_VN={morning:'Sáng',afternoon:'Chiều',evening:'Tối'};
const FILTER_KEY='tt-filters-v2';
const toast=(m,t)=>UIService.toast(m,t||'info');

function fmtDate(k){
    if(!k)return '—';
    const d=new Date(k+'T12:00:00');
    if(isNaN(d.getTime()))return k;
    return DOW[d.getDay()]+', '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
function fmtMins(n){ return n>=60?(Math.floor(n/60)+'h'+(n%60?String(n%60)+'p':'')):(n+'p') }
function monthLabel(mm){const p=String(mm||'').split('-');return p[1]?('tháng '+Number(p[1])+'/'+p[0]):'?'}
function thisMonthStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}

function guardAdmin(){
    let r=[];
    try{const p=JSON.parse(localStorage.getItem('currentRole'));r=Array.isArray(p)?p:[p]}catch(e){r=[localStorage.getItem('currentRole')]}
    if(!r.some(x=>['admin','senior_assistant'].includes(x))){
        toast('Trang này chỉ dành cho quản lý.','error');
        setTimeout(()=>{window.location.href='nhan-vien.html'},900);
        return false;
    }
    return true;
}

/* ============ ĐỐI CHIẾU TỰ ĐỘNG (đề xuất kiểm duyệt) ============
   Máy KHÔNG tự duyệt sau lưng quản lý. Máy chỉ đối chiếu những gì kiểm chứng được bằng dữ liệu
   và đưa ra ĐỀ XUẤT + lý do.
     - 'ok'   : ca CÓ trên lịch, đúng người, chưa hề có công → chỉ là quên chấm công
     - 'warn' : không kiểm chứng được (ca ngoài lịch)
     - 'miss' : thiếu trường bắt buộc → CHẶN duyệt cho tới khi bổ sung
     - 'bad'  : mâu thuẫn dữ liệu (đã có công / không có trên lịch / trùng giờ ca khác) */
const SECS_TT=['morning1','morning2','afternoon1','afternoon2','evening1','evening2'];
const BRS_TT=['cs1','cs2','cs3'];
const RS_TT={morning:{s:'07:00',e:'11:30'},afternoon:{s:'14:00',e:'18:00'},evening:{s:'18:00',e:'21:30'}};
const DK_TT=['mon','tue','wed','thu','fri','sat','sun'];
const dkOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const toMin=t=>{const p=String(t||'').split(':');return (+p[0]||0)*60+(+p[1]||0)};
const hmOfIso=i=>{const d=new Date(i);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

// Ghép các ca CHỒNG hoặc DÍNH LIỀN nhau của cùng một người thành khối liền mạch, theo từng cơ sở.
// Dùng để nhận ra yêu cầu chấm bù gộp nhiều lớp cùng giờ ("Toán 6 + Toán 7") hay gộp chuỗi ca
// liền nhau — những khung giờ không khớp đúng một dòng lịch đơn lẻ nào.
function mergeSpans(rows){
    const byBranch={};
    (rows||[]).forEach(x=>{ if(x&&x.start&&x.end)(byBranch[x.branch||'']=byBranch[x.branch||'']||[]).push(x) });
    const out=[];
    Object.keys(byBranch).forEach(b=>{
        const list=byBranch[b].slice().sort((a,c)=>toMin(a.start)-toMin(c.start));
        let cur=null;
        list.forEach(x=>{
            if(cur&&toMin(x.start)<=toMin(cur.end)){ if(toMin(x.end)>toMin(cur.end))cur.end=x.end; return }
            cur={branch:b,start:x.start,end:x.end}; out.push(cur);
        });
    });
    return out;
}

// DIỆN TIN TƯỞNG (xếp ở trang Nhân Sự). Chỉ người thuộc diện này mới được gom vào "Duyệt nhanh".
async function loadTrustedIds(){
    try{
        const users=await DBService.getUsers();
        const s=new Set();
        (users||[]).forEach(u=>{ if(u&&u.trustLevel==='trusted')s.add(String(u.id)) });
        return s;
    }catch(e){ console.warn('[Verdict] không đọc được diện tin tưởng:',e); return new Set() }
}

async function buildVerdicts(reqs){
    const out={};
    const trustedIds=await loadTrustedIds();
    const byStaffMonth={};
    reqs.forEach(r=>{
        const m=String(r.dateKey||'').slice(0,7);
        if(!m||!r.staffId)return;
        const k=r.staffId+'|'+m;
        (byStaffMonth[k]=byStaffMonth[k]||[]).push(r);
    });

    for(const key of Object.keys(byStaffMonth)){
        const [staffId,mStr]=key.split('|');
        const group=byStaffMonth[key];
        let attMap={};
        try{
            const logs=await DBService.getMonthlyAttendance(mStr,staffId);
            logs.forEach(l=>{attMap[l.date]=l.sessions||[]});
        }catch(e){}

        const dates=[...new Set(group.map(r=>r.dateKey).filter(Boolean))];
        const schedByDate={},recepByDate={};
        for(const dkey of dates){
            const rows=[];
            for(const b of BRS_TT){
                let v=null; try{ v=await DBService.getSchedule(b+'__'+dkey) }catch(e){}
                if(!v)continue;
                SECS_TT.forEach(sec=>(v[sec]||[]).forEach(row=>{
                    if(!row.start||!row.end)return;
                    // isAssignedToClass (db-service.js) đọc ĐỦ gvList + gvThayTeList + gvThayTheList
                    // + registeredTeachers → lớp xếp 2 GV thì GV thứ 2 cũng được nhận đúng.
                    rows.push({branch:b,start:row.start,end:row.end,lop:row.lop||'',
                        mine:isAssignedToClass(row,staffId)});
                }));
            }
            schedByDate[dkey]=rows;

            const d=new Date(dkey+'T12:00:00'),w=d.getDay(),mo=new Date(d);
            mo.setDate(d.getDate()-w+(w===0?-6:1));
            const mk=dkOf(mo),dayk=DK_TT[w===0?6:w-1];
            const rshifts=[];
            for(const b of BRS_TT){
                let v=null; try{ v=await DBService.getReceptionistSchedule(b+'__'+mk) }catch(e){}
                if(!v)continue;
                Object.keys(RS_TT).forEach(sk=>{
                    const en=((v[sk]||{})[dayk]||[]).find(x=>x.id===staffId); if(!en)return;
                    const cf=(v._shiftConfig&&v._shiftConfig[sk])||{};
                    rshifts.push({branch:b,shift:sk,
                        start:en.customStart||cf.start||RS_TT[sk].s,
                        end:en.customEnd||cf.end||RS_TT[sk].e});
                });
            }
            recepByDate[dkey]=rshifts;
        }

        group.forEach(r=>{
            const s=r.session||{};
            const sess=attMap[r.dateKey]||[];
            // Cùng một định nghĩa "đủ trường" với lúc nhân viên gửi (db-service.missingMakeupFields)
            const missing=DBService.missingMakeupFields(r);

            // 1) Đã có công chồng giờ chưa? (chống chấm bù trùng)
            let overlapped=false;
            if(s.checkIn&&s.checkOut){
                const a1=new Date(s.checkIn).getTime(),a2=new Date(s.checkOut).getTime();
                overlapped=sess.some(x=>{
                    if(!x||x.isAbsent||!x.checkIn)return false;
                    const b1=new Date(x.checkIn).getTime();
                    const b2=x.checkOut?new Date(x.checkOut).getTime():b1;
                    return Math.min(a2,b2)-Math.max(a1,b1)>=10*60*1000;
                });
            }

            // 1b) Trùng giờ với một yêu cầu KHÁC cũng đang chờ duyệt (nhân viên tách hai lớp dạy
            // song song thành hai đơn) → chỉ được duyệt một, không phải cả hai.
            let twinReq=null;
            if(s.checkIn&&s.checkOut&&!overlapped){
                const a1=new Date(s.checkIn).getTime(),a2=new Date(s.checkOut).getTime();
                twinReq=group.find(o=>{
                    if(o.id===r.id||o.dateKey!==r.dateKey)return false;
                    const os=o.session||{};
                    if(!os.checkIn||os.isAbsent)return false;
                    const b1=new Date(os.checkIn).getTime();
                    const b2=os.checkOut?new Date(os.checkOut).getTime():b1;
                    return Math.min(a2,b2)-Math.max(a1,b1)>=10*60*1000;
                })||null;
            }

            // 2) Ca có thật trên lịch và đúng người không?
            const startHM=s.checkIn?hmOfIso(s.checkIn):'',endHM=s.checkOut?hmOfIso(s.checkOut):'';
            const rows=schedByDate[r.dateKey]||[],rsh=recepByDate[r.dateKey]||[];
            const myRows=rows.filter(x=>x.mine).concat(rsh);
            const spans=mergeSpans(myRows);
            const inSpan=!!(startHM&&endHM&&spans.some(sp=>
                (!r.branch||!sp.branch||sp.branch===r.branch)&&
                toMin(sp.start)<=toMin(startHM)&&toMin(endHM)<=toMin(sp.end)));
            const exactRow=rows.find(x=>x.mine&&x.start===startHM&&x.end===endHM)||
                           rsh.find(x=>x.start===startHM&&x.end===endHM)||null;
            const schedMatch=exactRow||(inSpan?{start:startHM,end:endHM,merged:true}:null);
            const anyClassAtTime=rows.some(x=>toMin(x.start)<toMin(endHM)&&toMin(startHM)<toMin(x.end));

            const trusted=trustedIds.has(String(r.staffId));
            const hasMoneyExtra=!!(s.bonus10||(s.overtimeMinutes>0)||s.isAbsent);
            let level,title,reasons=[],quick=false;

            if(missing.length){
                level='miss'; title='Thiếu thông tin — chưa duyệt được';
                reasons.push('Chưa khai: '+missing.join(', ')+'.');
                reasons.push('Thiếu những mục này thì quản lý không có căn cứ kiểm chứng và Bảng Công cũng không áp được đơn giá. Hãy bấm "Bổ sung thông tin" để điền, hoặc từ chối và yêu cầu nhân viên khai lại.');
            }else if(overlapped){
                level='bad'; title='Đã có công trùng giờ';
                reasons.push('Bảng công đã có ca chồng khung giờ này — duyệt sẽ tính lương 2 lần.');
                reasons.push('Một người chỉ vào ca một lần: dạy 2 lớp cùng giờ vẫn là MỘT ca công, Bảng Công gộp thành một ô và trả theo lớp đơn giá cao nhất. Nếu ca đã có ghi thiếu lớp thì sửa tên lớp ở Bảng Công, đừng duyệt thêm ca.');
            }else if(twinReq){
                level='bad'; title='Trùng giờ với yêu cầu khác';
                reasons.push('Yêu cầu này chồng khung giờ với một yêu cầu khác cùng ngày '+twinReq.dateKey+' ("'+(twinReq.shiftLabel||'')+'") cũng đang chờ duyệt.');
                reasons.push('Nhân viên chỉ vào ca một lần nên hai lớp cùng giờ phải gộp thành MỘT ca công — chỉ duyệt một mục, mục còn lại từ chối và ghi rõ lý do (đã gộp).');
            }else if(r.type==='scheduled'&&schedMatch){
                level='ok';
                reasons.push(schedMatch.merged
                    ? 'Khung giờ này nằm trọn trong khối ca liên tục của nhân viên trên lịch (ca gộp nhiều lớp / chuỗi ca liền nhau), và chưa được ghi nhận công nào.'
                    : 'Ca có trên lịch, đúng người, đúng khung giờ, và chưa được ghi nhận công nào.');
                // 8 ĐIỀU KIỆN để máy coi là "đã kiểm chứng đủ, duyệt nhanh được"
                const autoSafe=r.type==='scheduled' && !!exactRow && !overlapped && !twinReq
                    && missing.length===0 && trusted && !hasMoneyExtra;
                if(autoSafe){
                    quick=true; title='Máy đã kiểm chứng — duyệt nhanh được';
                    reasons.push('Đủ điều kiện duyệt nhanh: khớp đúng một dòng lịch, đúng người thuộc diện tin tưởng, chưa có công, không trùng yêu cầu khác, khai đủ thông tin, và không kèm Sớm 10p / Tăng ca / ghi nhận vắng.');
                }else{
                    title='Khớp lịch — cần quản lý xem tay';
                    const why=[];
                    if(!trusted)why.push('người gửi chưa được xếp diện tin tưởng (trang Nhân Sự)');
                    if(!exactRow)why.push('khớp theo khối ca gộp, không khớp đúng một dòng lịch');
                    if(hasMoneyExtra)why.push('ca có kèm phát sinh tiền (Sớm 10p / Tăng ca) hoặc là ghi nhận vắng');
                    reasons.push('Không gom vào "Duyệt nhanh" vì: '+why.join('; ')+'.');
                }
            }else if(r.type==='scheduled'&&!schedMatch){
                level='bad'; title='Không tìm thấy ca trên lịch';
                reasons.push('Không có ca đúng khung giờ này của nhân viên trong lịch — cần kiểm tra lại (có thể lịch đã bị sửa hoặc đổi giáo viên sau khi nhân viên gửi).');
            }else{
                level='warn'; title='Ngoài lịch — cần quản lý xác nhận';
                reasons.push('Ca không có trên lịch nên hệ thống không tự đối chiếu được.');
                if(r.approvedBy)reasons.push('Nhân viên khai người phân công: '+r.approvedBy+'.');
                if(anyClassAtTime)reasons.push('Khung giờ này trung tâm CÓ lớp đang diễn ra (hợp lý).');
                else reasons.push('Khung giờ này không có lớp nào trên lịch — nên hỏi lại.');
            }
            out[r.id]={level:level,title:title,text:reasons.join(' '),quick:quick,trusted:trusted,missing:missing};
        });
    }
    return out;
}

/* ===== THÁNG TRẢ LƯƠNG (quy định GĐ Diễm 06/08/2026) =====
   Lỗi bên trung tâm (mất mạng, mất điện, hỏng máy) → trả NGAY trong tháng dạy.
   Nhân viên quên chấm công → trả vào THÁNG SAU.
   Ca vẫn nằm ở tháng dạy, giờ công và đơn giá giữ nguyên; chỉ có tiền dồn sang tháng chọn.
   So khớp sau khi BỎ DẤU: "mất mạng", "mat mang", "Mất Mạng" đều nhận ra. */
const stripTones=(v)=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
// MẶC ĐỊNH là "nhân viên quên" (trả tháng sau). Chỉ khi lý do nói RÕ một sự cố của
// THIẾT BỊ / HẠ TẦNG TRUNG TÂM thì mới chuyển sang "lỗi trung tâm" (trả trong tháng).
//
// Bản trước quá rộng nên bắt sai: "Quên mang điện thoại nên không chấm công được" bị tính là
// lỗi trung tâm — vì "mang" (mang theo) và "điện" (điện thoại) nằm trong danh sách thiết bị, và
// "không chấm công được" nằm trong danh sách sự cố. Kết quả là tiền của ca nhân viên tự quên
// lại được trả ngay trong tháng, trái quy định GĐ 06/08/2026. Nay:
//   - Bỏ "mang"/"dien" trần khỏi danh sách thiết bị; sự cố mạng/điện tách riêng CF_NET và
//     loại trừ "điện thoại" (đồ của nhân viên, không phải của trung tâm).
//   - "không chấm công được" / "không vào ca được" KHÔNG còn tự nó đủ nghĩa — đó là hệ quả,
//     mọi đơn đều viết vậy; phải có thiết bị/sự cố đi kèm.
const CF_THING=/wifi|internet|he\s*thong|phan\s*mem|ung\s*dung|server|trang\s*web|\bweb\b|\bapp\b|\bmay\b|nguon/;
const CF_NET=/mat\s*mang|rot\s*mang|mang\s*(yeu|lag|cham|loi|chap|kem|hong)|(mat|cup|hong|sap)\s*dien(?!\s*thoai)|dien\s*(bi\s*)?(cup|mat|hong)/;
const CF_TROUBLE=/loi|hong|hu|mat|rot|cup|sap|treo|chap\s*chon|yeu|bao\s*loi|khong\s*len|khong\s*(vao|truy\s*cap|dang\s*nhap|cham\s*cong|bam|luu)\s*(duoc|dc)/;
const CF_ALONE=/khong\s*(dang\s*nhap|truy\s*cap|luu)\s*(duoc|dc)|bao\s*loi|he\s*thong\s*loi|web\s*loi|app\s*loi/;
const CENTER_FAULT_RE={ test:(t)=>CF_ALONE.test(t)||CF_NET.test(t)||(CF_THING.test(t)&&CF_TROUBLE.test(t)) };

const nextMonthOf=(dateKey)=>{
    const [y,m]=String(dateKey||'').split('-').map(Number);
    if(!y||!m)return '';
    const ny=m===12?y+1:y, nm=m===12?1:m+1;
    return ny+'-'+String(nm).padStart(2,'0');
};
// Đoán lỗi thuộc về ai, dựa vào lý do nhân viên khai. Chỉ là GỢI Ý — người duyệt đổi được.
const guessCenterFault=(r)=>CENTER_FAULT_RE.test(stripTones((r&&r.reason)||''));

function payoutFor(r){
    const teachMonth=String(r.dateKey||'').slice(0,7);
    return guessCenterFault(r)
        ? { payoutMonth:teachMonth, payoutReason:'Lỗi trung tâm — trả trong tháng' }
        : { payoutMonth:nextMonthOf(r.dateKey), payoutReason:'Nhân viên quên chấm công — trả tháng sau' };
}

function payoutSummary(list){
    const rows=Array.isArray(list)?list:[];
    const inMonth=rows.filter(r=>guessCenterFault(r)).length;
    const nextMonth=rows.length-inMonth;
    return inMonth+' ca TRẢ TRONG THÁNG · '+nextMonth+' ca TRẢ THÁNG SAU';
}

// Hộp chọn THÁNG TRẢ bằng RADIO (bỏ prompt gõ số 1/2/3/4 — chỗ dễ bấm sai nhất về tiền).
// Trả về hàm map (r)=>{payoutMonth,payoutReason}, hoặc null nếu người duyệt huỷ.
// Compatibility helpers for the existing payout-month audit flow. The live UI
// below uses the safer modal; these retain the same explicit choices for
// callers that still request a per-session or bulk decision.
function askPayoutMonth(r){
  const answer=prompt(
    'Chọn tháng trả cho ca này:\n'+
    '1 = TRẢ TRONG THÁNG DẠY\n'+
    '2 = TRẢ THÁNG SAU\n'+
    '3 = Theo gợi ý tự đoán',

  );
  if(answer==='1') return {payoutMonth:String(r.dateKey||'').slice(0,7), payoutReason:'Lỗi trung tâm - trả trong tháng'};
  if(answer==='2') return {payoutMonth:nextMonthOf(r.dateKey), payoutReason:'Nhân viên quên chấm công - trả tháng sau'};
  if(answer==='3') return payoutFor(r);

function askPayoutMonthBulk(list){

function overlappingPairsIn(reqs){
  const rows=Array.isArray(reqs)?reqs:[];
  const pairs=[];
  for(let i=0;i<rows.length;i++){
    const a=rows[i]||{}, as=a.session||{};
    const aStart=new Date(as.checkIn||'').getTime();
    const aEnd=new Date(as.checkOut||'').getTime();
    if(!Number.isFinite(aStart)||!Number.isFinite(aEnd)||aEnd<=aStart) continue;
    for(let j=i+1;j<rows.length;j++){
      const b=rows[j]||{}, bs=b.session||{};
      if(a.dateKey!==b.dateKey) continue;
      const bStart=new Date(bs.checkIn||'').getTime();
      const bEnd=new Date(bs.checkOut||'').getTime();
      if(!Number.isFinite(bStart)||!Number.isFinite(bEnd)||bEnd<=bStart) continue;
      if(aStart<bEnd&&bStart<aEnd) pairs.push([a,b]);
    }
  }
  return pairs;
}

/* ================= BỘ LỌC ================= */
function kindOf(r){
    const s=r.session||{};
    if(s.isAbsent)return 'absent';
    if(s.role==='tiep-tan'||r.shiftKind==='tt'||(!r.className&&r.shiftKey))return 'tt';
    return 'gv';
}
function extraOf(r){
    const s=r.session||{};
    if(s.bonus10)return 'b10';
    if(s.overtimeMinutes>0)return 'ot';
    return 'none';
}
function matchQuick(r,q){
    const v=curVerdicts[r.id]||{};
    if(q==='bad')return v.level==='bad';
    if(q==='miss')return (v.missing&&v.missing.length>0)||v.level==='miss';
    if(q==='extra')return r.type!=='scheduled';
    if(q==='ok')return v.level==='ok';
    if(q==='auto')return !!v.quick;
    if(q==='old')return String(r.dateKey||'').slice(0,7)<thisMonthStr();
    return true;
}
function passFilters(r){
    if(filters.quick&&!matchQuick(r,filters.quick))return false;
    if(filters.month&&String(r.dateKey||'').slice(0,7)!==filters.month)return false;
    if(filters.staff&&String(r.staffId||'')!==filters.staff)return false;
    if(filters.branch){
        if(filters.branch==='__none'){ if(r.branch)return false }
        else if(String(r.branch||'')!==filters.branch)return false;
    }
    if(filters.kind&&kindOf(r)!==filters.kind)return false;
    if(filters.trust){
        const t=(curVerdicts[r.id]||{}).trusted;
        if(t===undefined)return false;              // tab không đối chiếu → không lọc theo diện
        if(filters.trust==='trusted'&&!t)return false;
        if(filters.trust==='untrusted'&&t)return false;
    }
    if(filters.payout){
        const isIn=guessCenterFault(r);
        if(filters.payout==='in'&&!isIn)return false;
        if(filters.payout==='next'&&isIn)return false;
    }
    if(filters.extra&&extraOf(r)!==filters.extra)return false;
    if(filters.q){
        const k=stripTones(filters.q).trim();
        const hay=stripTones([r.staffName,r.className,r.shiftLabel,r.reason,r.approvedBy,r.room].filter(Boolean).join(' '));
        if(k&&!hay.includes(k))return false;
    }
    return true;
}
function visibleReqs(){
    const list=curReqs.filter(passFilters);
    const cAt=r=>(r.createdAt&&r.createdAt.seconds)||0;
    list.sort((a,b)=>{
        if(sortMode==='createdDesc')return cAt(b)-cAt(a);
        const da=String(a.dateKey||''),db=String(b.dateKey||'');
        if(da!==db)return sortMode==='shiftDesc'?db.localeCompare(da):da.localeCompare(db);
        const na=String(a.staffName||''),nb=String(b.staffName||'');
        if(na!==nb)return na.localeCompare(nb,'vi');
        return String((a.session||{}).checkIn||'').localeCompare(String((b.session||{}).checkIn||''));
    });
    return list;
}
window.setFilter=function(k,v){ filters[k]=v; selected.clear(); saveFilters(); render() };
window.setSort=function(v){ sortMode=v; saveFilters(); render() };
window.toggleQuick=function(q){ filters.quick=(filters.quick===q?'':q); selected.clear(); saveFilters(); render() };
window.clearFilters=function(){
    filters={quick:'',month:'',staff:'',branch:'',kind:'',trust:'',payout:'',extra:'',q:''};
    selected.clear(); saveFilters(); buildFilterOptions(); render();
};
function saveFilters(){ try{ localStorage.setItem(FILTER_KEY,JSON.stringify({f:filters,s:sortMode})) }catch(e){} }
function restoreFilters(){
    try{
        const raw=JSON.parse(localStorage.getItem(FILTER_KEY)||'null');
        if(raw&&raw.f){ Object.keys(filters).forEach(k=>{ if(typeof raw.f[k]==='string')filters[k]=raw.f[k] }) }
        if(raw&&raw.s)sortMode=raw.s;
    }catch(e){}
}
function buildFilterOptions(){
    // Tháng: gom từ dữ liệu, luôn có tháng hiện tại
    const months=[...new Set(curReqs.map(r=>String(r.dateKey||'').slice(0,7)).filter(Boolean))];
    if(!months.includes(thisMonthStr()))months.push(thisMonthStr());
    months.sort().reverse();
    const mSel=document.getElementById('f-month');
    if(!months.includes(filters.month))filters.month='';
    mSel.innerHTML='<option value="">Mọi tháng ca</option>'+
        months.map(m=>'<option value="'+m+'">Ca '+monthLabel(m)+'</option>').join('');
    mSel.value=filters.month;

    // Nhân viên có trong danh sách
    const staff={};
    curReqs.forEach(r=>{ if(r.staffId)staff[r.staffId]=r.staffName||r.staffId });
    const ids=Object.keys(staff).sort((a,b)=>String(staff[a]).localeCompare(String(staff[b]),'vi'));
    const sSel=document.getElementById('f-staff');
    if(!ids.includes(filters.staff))filters.staff='';
    sSel.innerHTML='<option value="">Mọi nhân viên</option>'+
        ids.map(id=>'<option value="'+esc(id)+'">'+esc(staff[id])+'</option>').join('');
    sSel.value=filters.staff;

    document.getElementById('f-branch').value=filters.branch;
    document.getElementById('f-kind').value=filters.kind;
    document.getElementById('f-trust').value=filters.trust;
    document.getElementById('f-payout').value=filters.payout;
    document.getElementById('f-extra').value=filters.extra;
    document.getElementById('f-q').value=filters.q;
    document.getElementById('sortMode').value=sortMode;

    // Chiều "diện tin tưởng" chỉ có nghĩa ở tab Chờ duyệt (nơi có đối chiếu)
    const tSel=document.getElementById('f-trust');
    tSel.disabled=(curTab!=='pending');
    tSel.style.opacity=tSel.disabled?'.5':'1';
    if(tSel.disabled){ filters.trust=''; tSel.value='' }
    // Chỉ tab Chờ duyệt mới có thao tác hàng loạt
    const allLbl=document.querySelector('.lhead label.all');
    if(allLbl)allLbl.style.display=(curTab==='pending')?'inline-flex':'none';
}

    if(v.level==='bad')return {c:'st-bad',i:'shield-alert'};
    if(v.quick)return {c:'st-ok',i:'shield-check'};
    if(v.level==='ok')return {c:'st-ok',i:'user-check'};

window.saveCompleteForm=async function(id){
    const r=curReqs.find(x=>x.id===id); if(!r)return;
    const kind=kindOf(r);
    const g=(k)=>{const el=document.getElementById(k);return el?String(el.value||'').trim():''};
    const patch={ branch:g('fx-branch'), approvedBy:g('fx-appr'), room:g('fx-room'), reason:g('fx-reason') };
    if(kind==='tt'){ patch.shiftKey=g('fx-shift') }
    else{
        const name=g('fx-class');
        if(name){
            const norm=(v)=>String(v||'').trim().toLowerCase().replace(/\s+/g,' ');
            const m=subjectsCache.find(x=>norm(x.name)===norm(name));
            if(!m&&subjectsCache.length){
                const near=subjectsCache.filter(x=>norm(x.name).includes(norm(name))||norm(name).includes(norm(x.name)))
                                        .slice(0,5).map(x=>x.name);
                await UIService.notice('Môn / Lớp "'+name+'" không có trong danh mục Môn Học nên Bảng Công không áp được đơn giá.'+
                    (near.length?'\nÝ bạn là: '+near.join(' · ')+' ?':''),'Tên lớp không khớp danh mục','warning');
                return;
            }
            patch.className=m?m.name:name;
            if(m)patch.classId=m.id;
        }
    }
    // Nhãn ca hiển thị lại cho khớp thông tin mới
    const s=r.session||{};
    const what=kind==='tt'?('Tiếp Tân ca '+(SHIFT_VN[patch.shiftKey||r.shiftKey]||'')):(patch.className||r.className||'');
    const tmLbl=s.isAbsent?'Vắng':(ft(s.checkIn)+'–'+ft(s.checkOut));
    patch.shiftLabel=tmLbl+' '+String(patch.branch||r.branch||'').toUpperCase()+' ('+what+')'+((patch.room||r.room)?' – '+(patch.room||r.room):'');

    // Kiểm tra bằng ĐÚNG bộ luật lúc gửi, để bổ sung xong là chắc chắn duyệt được
    const merged=Object.assign({},r,patch);
    const stillMissing=DBService.missingMakeupFields(merged);
    if(stillMissing.length){
        await UIService.notice('Vẫn còn thiếu: '+stillMissing.join(', ')+'.\nHãy điền đủ rồi lưu lại.','Chưa đủ thông tin','warning');
        return;
    }
    try{
        UIService.showLoading('Đang lưu bổ sung...');
        await DBService.updateMakeupRequest(r.id,patch,adminName());
        UIService.hideLoading();
        toast('Đã bổ sung thông tin. Giờ có thể duyệt.','success');
        await loadTab(curTab);
        activeId=id; renderRows(); renderDetail();
    }catch(e){
        UIService.hideLoading();
        toast('Lưu thất bại: '+(e.message||e),'error');
    }
};

/* ================= DUYỆT / TỪ CHỐI ================= */
async function runBulkApprove(list,pickPayout){
    const done=[],skipped=[],failed=[];
    for(const r of list){
        const payout=pickPayout(r);
        try{ await DBService.approveMakeupRequest(r,adminName(),payout); done.push(r) }
        catch(e){
            // Duyệt hàng loạt KHÔNG được tự ghi đè ca trùng giờ — bỏ qua và báo lại để quản lý mở
            // từng mục xem, tránh một cú bấm sinh ra lương đôi.
            if(e&&e.code==='SESSION_OVERLAP'){ skipped.push(r); continue }
            failed.push({r:r,msg:e.message||String(e)});
        }
    }
    return {done:done,skipped:skipped,failed:failed};
}

function bulkReportText(res,total){
    let m='Đã duyệt '+res.done.length+'/'+total+' yêu cầu.';
    if(res.skipped.length){
        m+='\n\nBỏ qua '+res.skipped.length+' mục TRÙNG GIỜ với công đã có (ngày '+
           [...new Set(res.skipped.map(r=>r.dateKey))].join(', ')+').'+
           '\nMột người chỉ vào ca một lần — hai lớp cùng khung giờ là MỘT ca công, không duyệt thêm.'+
           '\nMở từng mục để xem và tự quyết định.';
    }
    if(res.failed.length){
        m+='\n\nLỗi ở '+res.failed.length+' mục:\n'+
           res.failed.slice(0,6).map(f=>'• '+f.r.dateKey+' ('+(f.r.staffName||'')+'): '+f.msg).join('\n');
        if(res.failed.length>6)m+='\n… xem Console để biết đủ.';
        console.error('[Tường trình] Lỗi duyệt:',res.failed);
    }
    return m;
}

async function doApprove(list,titleWhenEmpty){
    if(!list.length){ toast(titleWhenEmpty||'Không có mục nào để duyệt.','warning'); return }
    const pick=await askPayout(list);
    if(!pick)return;
    UIService.showLoading('Đang duyệt '+list.length+' yêu cầu...');
    const res=await runBulkApprove(list,pick);
    UIService.hideLoading();
    if(res.skipped.length||res.failed.length){
        await UIService.notice(bulkReportText(res,list.length),'Kết quả duyệt',res.done.length?'warning':'error');
    }else{
        toast('Đã duyệt '+res.done.length+' yêu cầu. Công đã ghi vào Bảng Công.','success');
    }
    selected.clear();
    await loadTab(curTab);
    refreshPendingCount();
}

window.approveOne=async function(id){
    const r=curReqs.find(x=>x.id===id); if(!r)return;
    if(DBService.missingMakeupFields(r).length){
        await UIService.notice('Yêu cầu này còn thiếu thông tin nên chưa duyệt được. Hãy bấm "Bổ sung thông tin".','Chưa đủ thông tin','warning');
        return;
    }
    const pick=await askPayout([r]);
    if(!pick)return;
    const payout=pick(r);
    try{
        UIService.showLoading('Đang duyệt...');
        await DBService.approveMakeupRequest(r,adminName(),payout);
        UIService.hideLoading();
        toast('Đã duyệt. Công đã ghi vào Bảng Công ('+payout.payoutReason+').','success');
        await loadTab(curTab); refreshPendingCount();
    }catch(e){
        UIService.hideLoading();
        // Ca trùng giờ với công đã có → hỏi lại thật rõ thay vì im lặng ghi thành lương đôi
        if(e&&e.code==='SESSION_OVERLAP'){
            const ok=await UIService.confirm('<b>KHÔNG DUYỆT ĐƯỢC</b> — '+esc(e.message)+
                '<br><br>Nhân viên chỉ bấm vào ca một lần. Dạy 2 lớp cùng khung giờ vẫn chỉ là MỘT ca công: '+
                'Bảng Công gộp thành một ô (VD "Toán 6 + Toán 7") và trả theo lớp đơn giá cao nhất, không cộng thêm giờ. '+
                'Trường hợp này nên TỪ CHỐI và sửa tên lớp của ca đã có.'+
                '<br><br>Chỉ đồng ý khi bạn chắc đây là hai ca làm việc KHÁC NHAU bị lệch giờ. Vẫn duyệt?');
            if(ok){
                try{
                    UIService.showLoading('Đang duyệt...');
                    await DBService.approveMakeupRequest(r,adminName(),Object.assign({allowOverlap:true},payout));
                    UIService.hideLoading();
                    toast('Đã duyệt (đã xác nhận cho phép trùng giờ).','success');
                    await loadTab(curTab); refreshPendingCount();
                }catch(e2){ UIService.hideLoading(); toast('Lỗi duyệt: '+(e2.message||e2),'error') }
            }
            return;
        }
        toast('Lỗi duyệt: '+(e.message||e),'error');
    }
};

};

window.rejectOne=async function(id){
    const r=curReqs.find(x=>x.id===id); if(!r)return;
    const reason=await askReject(1);
    if(!reason)return;
    try{
        UIService.showLoading('Đang từ chối...');
        await DBService.rejectMakeupRequest(id,adminName(),reason);
        UIService.hideLoading();
        toast('Đã từ chối và ghi lý do cho nhân viên.','success');
        await loadTab(curTab); refreshPendingCount();
    }catch(e){ UIService.hideLoading(); toast('Lỗi: '+(e.message||e),'error') }
};

window.rejectSelected=async function(){
    const list=curReqs.filter(r=>selected.has(r.id));
    if(!list.length)return;
    const reason=await askReject(list.length);
    if(!reason)return;
    const failed=[];
    UIService.showLoading('Đang từ chối '+list.length+' yêu cầu...');
    for(const r of list){
        try{ await DBService.rejectMakeupRequest(r.id,adminName(),reason) }
        catch(e){ failed.push(r.dateKey+' ('+(r.staffName||'')+')') }
    }
    UIService.hideLoading();
    if(failed.length)await UIService.notice('Từ chối được '+(list.length-failed.length)+'/'+list.length+' mục.\nLỗi ở: '+failed.join(', '),'Kết quả','warning');
    else toast('Đã từ chối '+list.length+' yêu cầu.','success');
    selected.clear();
    await loadTab(curTab); refreshPendingCount();
};

window.addEventListener('resize',()=>{
    if(window.innerWidth>1024){
        document.getElementById('detail').classList.remove('open');
        document.getElementById('sheet-mask').classList.remove('open');
        document.body.style.overflow='';
    }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeDetail() });

document.addEventListener('DOMContentLoaded',async function(){
    if(window.waitAuth){try{await window.waitAuth()}catch(e){}}
    if(!guardAdmin())return;
    restoreFilters();
    loadTab('pending');
    if(window.lucide)lucide.createIcons();
});
</script>
</body>
</html>
