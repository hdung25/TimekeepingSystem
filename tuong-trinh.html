<script>
let curTab='pending',curReqs=[],curVerdicts={};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const adminName=()=>localStorage.getItem('userFullName')||localStorage.getItem('currentUser')||'Admin';
const ft=i=>i?new Date(i).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}):'--:--';
const DOW=['CN','T2','T3','T4','T5','T6','T7'];

function guardAdmin(){
    let r=[];
    try{const p=JSON.parse(localStorage.getItem('currentRole'));r=Array.isArray(p)?p:[p]}catch(e){r=[localStorage.getItem('currentRole')]}
    if(!r.some(x=>['admin','senior_assistant'].includes(x))){
        alert('Trang này chỉ dành cho quản lý.'); window.location.href='nhan-vien.html'; return false;
    }
    return true;
}

// ================= ĐỐI CHIẾU TỰ ĐỘNG (đề xuất kiểm duyệt) =================
// Máy KHÔNG tự duyệt thay quản lý. Máy chỉ đối chiếu những gì kiểm chứng được bằng dữ liệu và
// đưa ra ĐỀ XUẤT + lý do, để quản lý bấm duyệt nhanh những ca rõ ràng và soi kỹ ca đáng ngờ.
//   - 'ok'   : ca CÓ trên lịch, đúng người, và chưa hề có công → chỉ là quên chấm công.
//   - 'warn' : không kiểm chứng được bằng dữ liệu (ca ngoài lịch) hoặc thiếu thông tin bắt buộc.
//   - 'bad'  : mâu thuẫn dữ liệu (đã có công rồi / ca không tồn tại trên lịch / trùng giờ ca khác).
const SECS_TT=['morning1','morning2','afternoon1','afternoon2','evening1','evening2'];
const BRS_TT=['cs1','cs2','cs3'];
const RS_TT={morning:{s:'07:00',e:'11:30'},afternoon:{s:'14:00',e:'18:00'},evening:{s:'18:00',e:'21:30'}};
const DK_TT=['mon','tue','wed','thu','fri','sat','sun'];
const dkOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const toMin=t=>{const p=String(t||'').split(':');return (+p[0]||0)*60+(+p[1]||0)};
const hmOfIso=i=>{const d=new Date(i);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

// DIỆN TIN TƯỞNG (xếp ở trang Nhân Sự). Chỉ người thuộc diện này mới được gom vào nút
// "Duyệt hàng loạt". Người chưa xếp diện: dù đối chiếu khớp lịch vẫn phải để Quản trị viên /
// Trợ lý cấp cao mở ra xem rồi bấm duyệt từng mục.
async function loadTrustedIds(){
    try{
        const users=await DBService.getUsers();
        const s=new Set();
        (users||[]).forEach(u=>{ if(u&&u.trustLevel==='trusted')s.add(String(u.id)) });
        return s;
    }catch(e){ console.warn('[Verdict] không đọc được diện tin tưởng:',e); return new Set() }
}

async function buildVerdicts(reqs){
    const out={};
    const trustedIds=await loadTrustedIds();
    const byStaffMonth={};
    reqs.forEach(r=>{
        const m=String(r.dateKey||'').slice(0,7);
        if(!m||!r.staffId)return;
        const k=r.staffId+'|'+m;
        (byStaffMonth[k]=byStaffMonth[k]||[]).push(r);
    });

    for(const key of Object.keys(byStaffMonth)){
        const [staffId,mStr]=key.split('|');
        const group=byStaffMonth[key];
        let attMap={};
        try{
            const logs=await DBService.getMonthlyAttendance(mStr,staffId);
            logs.forEach(l=>{attMap[l.date]=l.sessions||[]});
        }catch(e){}

        const dates=[...new Set(group.map(r=>r.dateKey).filter(Boolean))];
        const schedByDate={},recepByDate={};
        for(const dkey of dates){
            const rows=[];
            for(const b of BRS_TT){
                let v=null; try{ v=await DBService.getSchedule(b+'__'+dkey) }catch(e){}
                if(!v)continue;
                SECS_TT.forEach(sec=>(v[sec]||[]).forEach(row=>{
                    if(!row.start||!row.end)return;
                    rows.push({branch:b,start:row.start,end:row.end,lop:row.lop||'',
                        mine:(row.gvId===staffId)||(row.gvThayTheId===staffId)||
                             (row.gvList||[]).some(g=>g.id===staffId)||
                             (row.gvThayTheList||[]).some(g=>g.id===staffId)||
                             (row.registeredTeachers||[]).some(t=>t.id===staffId)});
                }));
            }
            schedByDate[dkey]=rows;

            const d=new Date(dkey+'T12:00:00'),w=d.getDay(),mo=new Date(d);
            mo.setDate(d.getDate()-w+(w===0?-6:1));
            const mk=dkOf(mo),dayk=DK_TT[w===0?6:w-1];
            const rshifts=[];
            for(const b of BRS_TT){
                let v=null; try{ v=await DBService.getReceptionistSchedule(b+'__'+mk) }catch(e){}
                if(!v)continue;
                Object.keys(RS_TT).forEach(sk=>{
                    const en=((v[sk]||{})[dayk]||[]).find(x=>x.id===staffId); if(!en)return;
                    const cf=(v._shiftConfig&&v._shiftConfig[sk])||{};
                    rshifts.push({branch:b,shift:sk,
                        start:en.customStart||cf.start||RS_TT[sk].s,
                        end:en.customEnd||cf.end||RS_TT[sk].e});
                });
            }
            recepByDate[dkey]=rshifts;
        }

        group.forEach(r=>{
            const s=r.session||{};
            const sess=attMap[r.dateKey]||[];
            const missing=[];
            if(!r.branch)missing.push('cơ sở');
            const isTT=s.role==='tiep-tan';
            if(r.type!=='scheduled'){
                if(!isTT&&!r.className)missing.push('môn/lớp');
                if(isTT&&!r.shiftKey)missing.push('ca trực');
                if(!r.approvedBy)missing.push('người phân công');
            }
            if(!s.isAbsent&&(!s.checkIn||!s.checkOut))missing.push('giờ vào/ra');

            // 1) Đã có công chồng giờ chưa? (chống chấm bù trùng)
            let overlapped=false;
            if(s.checkIn&&s.checkOut){
                const a1=new Date(s.checkIn).getTime(),a2=new Date(s.checkOut).getTime();
                overlapped=sess.some(x=>{
                    if(!x||x.isAbsent||!x.checkIn)return false;
                    const b1=new Date(x.checkIn).getTime();
                    const b2=x.checkOut?new Date(x.checkOut).getTime():b1;
                    return Math.min(a2,b2)-Math.max(a1,b1)>=10*60*1000;
                });
            }

            // 2) Ca có thật trên lịch và đúng người không?
            const startHM=s.checkIn?hmOfIso(s.checkIn):'',endHM=s.checkOut?hmOfIso(s.checkOut):'';
            const rows=schedByDate[r.dateKey]||[],rsh=recepByDate[r.dateKey]||[];
            const schedMatch=rows.find(x=>x.mine&&x.start===startHM&&x.end===endHM)||
                             rsh.find(x=>x.start===startHM&&x.end===endHM);
            const anyClassAtTime=rows.some(x=>toMin(x.start)<toMin(endHM)&&toMin(startHM)<toMin(x.end));

            const trusted=trustedIds.has(String(r.staffId));
            let level,title,reasons=[],quick=false;
            if(missing.length){
                level='warn'; title='Thiếu thông tin';
                reasons.push('Chưa khai: '+missing.join(', ')+'.');
            }else if(overlapped){
                level='bad'; title='Đã có công trùng giờ';
                reasons.push('Bảng công đã có ca chồng khung giờ này — duyệt sẽ tính lương 2 lần.');
            }else if(r.type==='scheduled'&&schedMatch){
                level='ok';
                reasons.push('Ca có trên lịch, đúng người, và chưa được ghi nhận công nào.');
                if(trusted){
                    quick=true; title='Khớp lịch — đủ điều kiện duyệt nhanh';
                    reasons.push('Nhân viên thuộc diện tin tưởng nên nằm trong nhóm duyệt hàng loạt.');
                }else{
                    title='Khớp lịch — cần quản lý duyệt tay';
                    reasons.push('Nhân viên CHƯA được xếp diện tin tưởng (trang Nhân Sự) nên không gom vào nút duyệt hàng loạt — Quản trị viên / Trợ lý cấp cao xem rồi bấm duyệt từng mục.');
                }
            }else if(r.type==='scheduled'&&!schedMatch){
                level='bad'; title='Không tìm thấy ca trên lịch';
                reasons.push('Không có ca đúng khung giờ này của nhân viên trong lịch — cần kiểm tra lại.');
            }else{
                level='warn'; title='Ngoài lịch — cần quản lý xác nhận';
                reasons.push('Ca không có trên lịch nên hệ thống không tự đối chiếu được.');
                if(r.approvedBy)reasons.push('Nhân viên khai người phân công: '+r.approvedBy+'.');
                if(anyClassAtTime)reasons.push('Khung giờ này trung tâm CÓ lớp đang diễn ra (hợp lý).');
                else reasons.push('Khung giờ này không có lớp nào trên lịch — nên hỏi lại.');
            }
            out[r.id]={level:level,title:title,text:reasons.join(' '),quick:quick,trusted:trusted};
        });
    }
    return out;
}

async function refreshPendingCount(){
    try{ const p=await DBService.getMakeupRequestsByStatus('pending');
         document.getElementById('c-pending').innerText=p.length; }catch(e){}
}

window.loadTab=async function(tab){
    curTab=tab;
    ['pending','approved','rejected'].forEach(t=>document.getElementById('t-'+t).classList.toggle('on',t===tab));
    const el=document.getElementById('list');
    el.innerHTML='<div class="empty">Đang tải...</div>';
    curReqs=await DBService.getMakeupRequestsByStatus(tab);
    if(tab==='pending')document.getElementById('c-pending').innerText=curReqs.length;
    if(!curReqs.length){
        el.innerHTML='<div class="empty"><i data-lucide="inbox"></i><div style="font-weight:600;color:#374151">Không có yêu cầu nào</div>'+
            '<div style="font-size:.82rem;margin-top:3px">'+(tab==='pending'?'Tất cả tường trình đã được xử lý.':'Chưa có mục nào ở đây.')+'</div></div>';
        if(window.lucide)lucide.createIcons();
        return;
    }
    // Đối chiếu tự động trước khi vẽ (chỉ tab chờ duyệt mới cần)
    curVerdicts={};
    if(tab==='pending'){
        el.innerHTML='<div class="empty">Đang đối chiếu dữ liệu lịch & bảng công...</div>';
        try{ curVerdicts=await buildVerdicts(curReqs) }catch(e){ console.warn('[Verdict]',e) }
    }

    const groups={};
    curReqs.forEach(r=>{const k=r.batchId||r.id; if(!groups[k])groups[k]=[]; groups[k].push(r)});
    // Chỉ gom mục KHỚP LỊCH của người thuộc DIỆN TIN TƯỞNG vào nút duyệt hàng loạt.
    const okCount=curReqs.filter(r=>(curVerdicts[r.id]||{}).quick).length;
    const manualOk=curReqs.filter(r=>{const v=curVerdicts[r.id]||{};return v.level==='ok'&&!v.quick}).length;
    const topBar=(tab==='pending'&&(okCount>0||manualOk>0))
        ? '<div class="grp" style="padding:.85rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">'+
          '<div style="font-size:.85rem;color:#065F46">'+
            (okCount>0?'<b>'+okCount+' yêu cầu</b> khớp lịch, chưa có công, của người thuộc <b>diện tin tưởng</b> — an toàn để duyệt nhanh.':'')+
            (manualOk>0?(okCount>0?'<br>':'')+'<span style="color:#92400E">'+manualOk+' yêu cầu khớp lịch nhưng người gửi chưa được xếp diện tin tưởng — cần xem và duyệt từng mục.</span>':'')+
          '</div>'+
          (okCount>0?'<button class="btn b-all" onclick="approveAllEligible()"><i data-lucide="check-check" style="width:15px;height:15px"></i> Duyệt '+okCount+' mục đủ điều kiện</button>':'')+
          '</div>'
        : '';
    el.innerHTML=Object.keys(groups).map(function(bk){
        const reqs=groups[bk],f=reqs[0];
        const t=f.createdAt&&f.createdAt.seconds?new Date(f.createdAt.seconds*1000).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}):'';
        const initial=String(f.staffName||'N').trim().charAt(0).toUpperCase();
        const bulk=(tab==='pending'&&reqs.length>1)?'<button class="btn b-all" onclick="approveBatch(\''+bk+'\')"><i data-lucide="check-check" style="width:15px;height:15px"></i> Duyệt cả nhóm ('+reqs.length+')</button>':'';
        const rows=reqs.map(function(r){
            const s=r.session||{};
            const isAbs=!!s.isAbsent, isEx=r.type!=='scheduled';
            const tcls=isAbs?'t-abs':(isEx?'t-extra':'t-sched');
            const tblock=isAbs?'VẮNG':(ft(s.checkIn)+'<small>'+ft(s.checkOut)+'</small>');
            const d=new Date(r.dateKey+'T12:00:00');
            const dateStr=DOW[d.getDay()]+', '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
            let mins=0;
            if(!isAbs&&s.checkIn&&s.checkOut)mins=Math.round((new Date(s.checkOut)-new Date(s.checkIn))/60000);
            const metas=[];
            if(mins>0)metas.push('<span><i data-lucide="clock" style="width:13px;height:13px"></i> '+(mins>=60?Math.floor(mins/60)+'h'+(mins%60?(mins%60)+'p':''):mins+'p')+'</span>');
            // Thông tin ĐỦ để quản lý kiểm duyệt: cơ sở – lớp/ca – phòng – người phân công
            metas.push(r.branch
                ? '<span><i data-lucide="map-pin" style="width:13px;height:13px"></i> '+esc(String(r.branch).toUpperCase())+'</span>'
                : '<span class="miss">Thiếu cơ sở</span>');
            if(r.className)metas.push('<span><i data-lucide="book-open" style="width:13px;height:13px"></i> '+esc(r.className)+'</span>');
            else if(r.shiftKey)metas.push('<span><i data-lucide="book-open" style="width:13px;height:13px"></i> Ca '+esc({morning:'Sáng',afternoon:'Chiều',evening:'Tối'}[r.shiftKey]||r.shiftKey)+'</span>');
            else if(isEx)metas.push('<span class="miss">Thiếu môn/lớp</span>');
            if(r.room)metas.push('<span><i data-lucide="door-open" style="width:13px;height:13px"></i> '+esc(r.room)+'</span>');
            if(s.roleName)metas.push('<span><i data-lucide="user" style="width:13px;height:13px"></i> '+esc(s.roleName)+'</span>');
            if(r.approvedBy)metas.push('<span><i data-lucide="user-check" style="width:13px;height:13px"></i> '+esc(r.approvedBy)+'</span>');
            else if(isEx)metas.push('<span class="miss">Thiếu người phân công</span>');
            if(s.bonus10)metas.push('<span><i data-lucide="star" style="width:13px;height:13px"></i> Sớm 10p</span>');
            if(s.overtimeMinutes>0)metas.push('<span><i data-lucide="plus-circle" style="width:13px;height:13px"></i> Tăng ca '+s.overtimeMinutes+'p</span>');

            const v=curVerdicts[r.id];
            // Khớp lịch nhưng người gửi chưa thuộc diện tin tưởng → tô vàng để quản lý biết
            // phải tự xem, không lẫn với nhóm xanh được duyệt hàng loạt.
            const vCls=(v&&v.level==='ok'&&!v.quick)?'warn':(v?v.level:'');
            const vIcon=!v?'':(v.level==='bad'?'shield-alert':(v.quick?'shield-check':(v.level==='ok'?'user-check':'help-circle')));
            const vHtml=v?('<div class="vd vd-'+vCls+'"><i data-lucide="'+vIcon+
                '" style="width:15px;height:15px;flex-shrink:0;margin-top:1px"></i><div><b>Đối chiếu tự động: '+
                esc(v.title)+'</b><br>'+esc(v.text)+'</div></div>'):'';
            let act='';
            if(tab==='pending')act='<div class="acts"><button class="btn b-ok" onclick="approveOne(\''+r.id+'\')"><i data-lucide="check" style="width:15px;height:15px"></i> Duyệt</button>'+
                '<button class="btn b-no" onclick="rejectOne(\''+r.id+'\')"><i data-lucide="x" style="width:15px;height:15px"></i> Từ chối</button></div>';
            else if(tab==='approved')act='<div style="font-size:.74rem;color:var(--mut)">Duyệt bởi '+esc(r.reviewedBy||'Admin')+'</div>';
            else act='<div style="font-size:.74rem;color:#991B1B">Lý do từ chối: '+esc(r.rejectReason||'(không ghi)')+'</div>';
            return '<div class="sc"><div class="sc-t '+tcls+'">'+tblock+'</div><div class="sc-b">'+
                '<div class="sc-r1"><div style="min-width:0">'+
                '<div class="sc-nm">'+esc(r.shiftLabel||'')+'</div>'+
                '<div class="sc-sb">'+dateStr+'</div></div>'+
                '<span class="bdg '+(isEx?'b-e':'b-s')+'">'+(isEx?'Ngoài lịch':'Có lịch')+'</span></div>'+
                (metas.length?'<div class="sc-meta">'+metas.join('')+'</div>':'')+
                '<div class="why"><b>Lý do:</b> '+esc(r.reason||'(không ghi)')+'</div>'+vHtml+act+'</div></div>';
        }).join('');
        return '<div class="grp"><div class="grp-h"><div class="who"><div class="av">'+esc(initial)+'</div>'+
            '<div><div class="n">'+esc(f.staffName||f.staffId)+'</div><div class="s">Gửi lúc '+t+' · '+reqs.length+' yêu cầu</div></div></div>'+
            bulk+'</div><div class="body">'+rows+'</div></div>';
    }).join('');
    el.innerHTML=topBar+el.innerHTML;
    if(window.lucide)lucide.createIcons();
};

// Duyệt hàng loạt các yêu cầu mà đối chiếu tự động cho kết quả "khớp lịch, chưa có công".
// Vẫn cần quản lý bấm nút — hệ thống không tự duyệt sau lưng.
window.approveAllEligible=async function(){
    const list=curReqs.filter(r=>(curVerdicts[r.id]||{}).quick);
    if(!list.length)return;
    if(!confirm('Duyệt '+list.length+' yêu cầu KHỚP LỊCH, chưa có công, của người thuộc diện tin tưởng?\nCông sẽ được ghi vào Bảng Công.'))return;
    let done=0; const skipped=[];
    for(const r of list){
        try{ await DBService.approveMakeupRequest(r,adminName()); done++ }
        catch(e){
            if(e&&e.code==='SESSION_OVERLAP'){ skipped.push(r.dateKey); continue }
            alert('Lỗi ở yêu cầu ngày '+r.dateKey+': '+(e.message||e)); break;
        }
    }
    alert('Đã duyệt '+done+'/'+list.length+' yêu cầu.'+
        (skipped.length?'\nBỏ qua '+skipped.length+' mục trùng giờ với công đã có (ngày '+skipped.join(', ')+') — mở từng mục để tự quyết định.':''));
    loadTab(curTab); refreshPendingCount();
};

window.approveOne=async function(id){
    const r=curReqs.find(x=>x.id===id); if(!r)return;
    if(!confirm('Duyệt yêu cầu của '+(r.staffName||'')+' ngày '+r.dateKey+'?\nCông sẽ được ghi vào Bảng Công.'))return;
    try{ await DBService.approveMakeupRequest(r,adminName()); loadTab(curTab); refreshPendingCount(); }
    catch(e){
        // Ca trùng giờ với công đã có → hỏi lại thật rõ thay vì im lặng ghi thành lương đôi.
        if(e&&e.code==='SESSION_OVERLAP'){
            if(confirm('KHÔNG DUYỆT ĐƯỢC — '+e.message+'\n\nNhân viên chỉ bấm vào ca một lần, nên hai ca cùng giờ thường là dạy 2 lớp cùng lúc hoặc đã khai/duyệt trùng.\n\nVẫn duyệt và chấp nhận có 2 ca cùng khung giờ?')){
                try{ await DBService.approveMakeupRequest(r,adminName(),{allowOverlap:true}); loadTab(curTab); refreshPendingCount(); }
                catch(e2){ alert('Lỗi duyệt: '+(e2.message||e2)) }
            }
            return;
        }
        alert('Lỗi duyệt: '+(e.message||e));
    }
};

window.rejectOne=async function(id){
    const reason=prompt('Lý do từ chối (nhân viên sẽ thấy):');
    if(reason===null)return;
    try{ await DBService.rejectMakeupRequest(id,adminName(),reason); loadTab(curTab); refreshPendingCount(); }
    catch(e){ alert('Lỗi: '+(e.message||e)) }
};

window.approveBatch=async function(bk){
    const reqs=curReqs.filter(r=>(r.batchId||r.id)===bk);
    if(!confirm('Duyệt TẤT CẢ '+reqs.length+' yêu cầu của nhóm này?'))return;
    // Duyệt hàng loạt KHÔNG được tự ghi đè ca trùng giờ — bỏ qua và báo lại để quản lý
    // mở từng mục xem, tránh một cú bấm sinh ra lương đôi.
    const skipped=[];
    for(const r of reqs){
        try{ await DBService.approveMakeupRequest(r,adminName()) }
        catch(e){
            if(e&&e.code==='SESSION_OVERLAP'){ skipped.push(r.dateKey); continue }
            alert('Lỗi ở yêu cầu ngày '+r.dateKey+': '+(e.message||e)); break;
        }
    }
    if(skipped.length)alert('Đã bỏ qua '+skipped.length+' yêu cầu trùng giờ với công đã có (ngày '+skipped.join(', ')+').\nMở từng mục để xem và tự quyết định.');
    loadTab(curTab); refreshPendingCount();
};

document.addEventListener('DOMContentLoaded',async function(){
    if(window.waitAuth){try{await window.waitAuth()}catch(e){}}
    if(!guardAdmin())return;
    loadTab('pending');
    if(window.lucide)lucide.createIcons();
});
</script>
