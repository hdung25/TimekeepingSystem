<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tường Trình - Hệ Thống Chấm Công</title>
    <link rel="icon" type="image/jpg" href="images/TUDUYTRE.jpg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <script src='https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js'></script>
    <script src='https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js'></script>
    <script src='https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js'></script>
    <script src='js/firebase-config.js'></script>
    <script src='js/auth-guard.js?v=20260721-meeting-gps-v1'></script>
    <script src='js/db-service.js?v=20260721-meeting-gps-v1'></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root{--p:#059669;--p-d:#047857;--p-s:#ECFDF5;--ink:#111827;--mut:#6B7280;--ln:#E5E7EB;--bg:#F0FDF4;
              --warn:#F59E0B;--warn-s:#FFFBEB;--info:#3B82F6;--info-s:#EFF6FF;--dan:#EF4444;--dan-s:#FEE2E2;}
        *{box-sizing:border-box;margin:0}
        body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:2rem}
        .top{background:white;border-bottom:1px solid var(--ln);padding:.8rem 1rem;display:flex;align-items:center;gap:.7rem;position:sticky;top:0;z-index:60}
        .top a{display:inline-flex;align-items:center;gap:4px;color:var(--mut);text-decoration:none;font-size:.85rem;font-weight:600;padding:6px 10px;border-radius:8px}
        .top a:hover{background:var(--p-s);color:var(--p)}
        .top h1{font-size:1.05rem;font-weight:700;color:var(--p-d)}
        .wrap{max-width:820px;margin:0 auto;padding:1rem}
        .tabs{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
        .tab{padding:.55rem 1.1rem;border-radius:99px;border:1.5px solid var(--ln);background:white;cursor:pointer;font-weight:700;font-size:.85rem;color:var(--mut);font-family:inherit;display:inline-flex;align-items:center;gap:6px}
        .tab.on{background:var(--p);border-color:var(--p);color:white}
        .cnt{background:rgba(0,0,0,.08);padding:1px 7px;border-radius:99px;font-size:.72rem}
        .tab.on .cnt{background:rgba(255,255,255,.25)}
        .grp{background:white;border:1px solid var(--ln);border-radius:16px;margin-bottom:1rem;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04)}
        .grp-h{padding:.85rem 1rem;background:#F9FAFB;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
        .who{display:flex;align-items:center;gap:10px;min-width:0}
        .av{width:38px;height:38px;border-radius:50%;background:var(--p-s);color:var(--p-d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex-shrink:0}
        .who .n{font-weight:700;font-size:.92rem}
        .who .s{font-size:.74rem;color:var(--mut)}
        .body{padding:.85rem 1rem}
        .sc{display:flex;border:1.5px solid var(--ln);border-radius:14px;overflow:hidden;margin-bottom:.7rem;background:white}
        .sc:last-child{margin-bottom:0}
        .sc-t{color:white;padding:.85rem .55rem;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:76px;flex-shrink:0;font-weight:700;font-size:.9rem;line-height:1.5}
        .sc-t small{font-weight:500;opacity:.88;font-size:.78rem}
        .t-sched{background:var(--p)}.t-extra{background:var(--warn)}.t-abs{background:#9CA3AF}
        .sc-b{flex:1;padding:.75rem .85rem;min-width:0}
        .sc-r1{display:flex;align-items:flex-start;gap:9px;justify-content:space-between}
        .sc-nm{font-weight:700;font-size:.9rem;line-height:1.35}
        .sc-sb{font-size:.76rem;color:var(--mut);margin-top:2px}
        .bdg{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;flex-shrink:0}
        .b-s{background:var(--p-s);color:var(--p-d)}.b-e{background:var(--warn-s);color:#92400E}
        .b-i{background:var(--info-s);color:#1E40AF}.b-r{background:var(--dan-s);color:#991B1B}
        .b-n{background:#F3F4F6;color:#6B7280}
        .sc-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--mut);margin:.5rem 0}
        .sc-meta span{display:inline-flex;align-items:center;gap:4px}
        .why{background:#F9FAFB;border-radius:9px;padding:.5rem .7rem;font-size:.78rem;color:#374151;margin:.5rem 0 .6rem;line-height:1.5}
        .acts{display:flex;gap:7px;flex-wrap:wrap}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-family:inherit;padding:.5rem 1rem;font-size:.8rem}
        .b-ok{background:var(--p);color:white}.b-ok:hover{background:var(--p-d)}
        .b-no{background:white;color:#991B1B;border:1.5px solid #FCA5A5}.b-no:hover{background:var(--dan-s)}
        .b-all{background:white;color:var(--p-d);border:1.5px solid var(--p);padding:.5rem .95rem}
        .b-all:hover{background:var(--p-s)}
        .btn:disabled{opacity:.5;cursor:not-allowed}
        .empty{text-align:center;color:var(--mut);padding:2.5rem 1rem;background:white;border-radius:16px;border:1px solid var(--ln)}
        .empty i{width:34px;height:34px;color:#D1D5DB;margin-bottom:.6rem}
        @media(max-width:520px){.sc-t{min-width:66px;font-size:.84rem}.grp-h{align-items:flex-start}}
    </style>
</head>
<body>
    <div class="top">
        <a href="admin.html"><i data-lucide="arrow-left" style="width:16px;height:16px"></i> Quản Lý</a>
        <h1>Tường Trình Chấm Công Bù</h1>
    </div>
    <div class="wrap">
        <div class="tabs">
            <button class="tab on" id="t-pending" onclick="loadTab('pending')">Chờ duyệt <span class="cnt" id="c-pending">0</span></button>
            <button class="tab" id="t-approved" onclick="loadTab('approved')">Đã duyệt</button>
            <button class="tab" id="t-rejected" onclick="loadTab('rejected')">Từ chối</button>
        </div>
        <div id="list"><div class="empty">Đang tải...</div></div>
    </div>

<script>
let curTab='pending',curReqs=[];
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const adminName=()=>localStorage.getItem('userFullName')||localStorage.getItem('currentUser')||'Admin';
const ft=i=>i?new Date(i).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}):'--:--';
const DOW=['CN','T2','T3','T4','T5','T6','T7'];

function guardAdmin(){
    let r=[];
    try{const p=JSON.parse(localStorage.getItem('currentRole'));r=Array.isArray(p)?p:[p]}catch(e){r=[localStorage.getItem('currentRole')]}
    if(!r.some(x=>['admin','senior_assistant'].includes(x))){
        alert('Trang này chỉ dành cho quản lý.'); window.location.href='nhan-vien.html'; return false;
    }
    return true;
}

async function refreshPendingCount(){
    try{ const p=await DBService.getMakeupRequestsByStatus('pending');
         document.getElementById('c-pending').innerText=p.length; }catch(e){}
}

window.loadTab=async function(tab){
    curTab=tab;
    ['pending','approved','rejected'].forEach(t=>document.getElementById('t-'+t).classList.toggle('on',t===tab));
    const el=document.getElementById('list');
    el.innerHTML='<div class="empty">Đang tải...</div>';
    curReqs=await DBService.getMakeupRequestsByStatus(tab);
    if(tab==='pending')document.getElementById('c-pending').innerText=curReqs.length;
    if(!curReqs.length){
        el.innerHTML='<div class="empty"><i data-lucide="inbox"></i><div style="font-weight:600;color:#374151">Không có yêu cầu nào</div>'+
            '<div style="font-size:.82rem;margin-top:3px">'+(tab==='pending'?'Tất cả tường trình đã được xử lý.':'Chưa có mục nào ở đây.')+'</div></div>';
        if(window.lucide)lucide.createIcons();
        return;
    }
    const groups={};
    curReqs.forEach(r=>{const k=r.batchId||r.id; if(!groups[k])groups[k]=[]; groups[k].push(r)});
    el.innerHTML=Object.keys(groups).map(function(bk){
        const reqs=groups[bk],f=reqs[0];
        const t=f.createdAt&&f.createdAt.seconds?new Date(f.createdAt.seconds*1000).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}):'';
        const initial=String(f.staffName||'N').trim().charAt(0).toUpperCase();
        const bulk=(tab==='pending'&&reqs.length>1)?'<button class="btn b-all" onclick="approveBatch(\''+bk+'\')"><i data-lucide="check-check" style="width:15px;height:15px"></i> Duyệt cả nhóm ('+reqs.length+')</button>':'';
        const rows=reqs.map(function(r){
            const s=r.session||{};
            const isAbs=!!s.isAbsent, isEx=r.type!=='scheduled';
            const tcls=isAbs?'t-abs':(isEx?'t-extra':'t-sched');
            const tblock=isAbs?'VẮNG':(ft(s.checkIn)+'<small>'+ft(s.checkOut)+'</small>');
            const d=new Date(r.dateKey+'T12:00:00');
            const dateStr=DOW[d.getDay()]+', '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
            let mins=0;
            if(!isAbs&&s.checkIn&&s.checkOut)mins=Math.round((new Date(s.checkOut)-new Date(s.checkIn))/60000);
            const metas=[];
            if(mins>0)metas.push('<span><i data-lucide="clock" style="width:13px;height:13px"></i> '+(mins>=60?Math.floor(mins/60)+'h'+(mins%60?(mins%60)+'p':''):mins+'p')+'</span>');
            if(s.roleName)metas.push('<span><i data-lucide="user" style="width:13px;height:13px"></i> '+esc(s.roleName)+'</span>');
            if(s.bonus10)metas.push('<span><i data-lucide="star" style="width:13px;height:13px"></i> Sớm 10p</span>');
            if(s.overtimeMinutes>0)metas.push('<span><i data-lucide="plus-circle" style="width:13px;height:13px"></i> Tăng ca '+s.overtimeMinutes+'p</span>');
            let act='';
            if(tab==='pending')act='<div class="acts"><button class="btn b-ok" onclick="approveOne(\''+r.id+'\')"><i data-lucide="check" style="width:15px;height:15px"></i> Duyệt</button>'+
                '<button class="btn b-no" onclick="rejectOne(\''+r.id+'\')"><i data-lucide="x" style="width:15px;height:15px"></i> Từ chối</button></div>';
            else if(tab==='approved')act='<div style="font-size:.74rem;color:var(--mut)">Duyệt bởi '+esc(r.reviewedBy||'Admin')+'</div>';
            else act='<div style="font-size:.74rem;color:#991B1B">Lý do từ chối: '+esc(r.rejectReason||'(không ghi)')+'</div>';
            return '<div class="sc"><div class="sc-t '+tcls+'">'+tblock+'</div><div class="sc-b">'+
                '<div class="sc-r1"><div style="min-width:0">'+
                '<div class="sc-nm">'+esc(r.shiftLabel||'')+'</div>'+
                '<div class="sc-sb">'+dateStr+'</div></div>'+
                '<span class="bdg '+(isEx?'b-e':'b-s')+'">'+(isEx?'Ngoài lịch':'Có lịch')+'</span></div>'+
                (metas.length?'<div class="sc-meta">'+metas.join('')+'</div>':'')+
                '<div class="why"><b>Lý do:</b> '+esc(r.reason||'(không ghi)')+'</div>'+act+'</div></div>';
        }).join('');
        return '<div class="grp"><div class="grp-h"><div class="who"><div class="av">'+esc(initial)+'</div>'+
            '<div><div class="n">'+esc(f.staffName||f.staffId)+'</div><div class="s">Gửi lúc '+t+' · '+reqs.length+' yêu cầu</div></div></div>'+
            bulk+'</div><div class="body">'+rows+'</div></div>';
    }).join('');
    if(window.lucide)lucide.createIcons();
};

window.approveOne=async function(id){
    const r=curReqs.find(x=>x.id===id); if(!r)return;
    if(!confirm('Duyệt yêu cầu của '+(r.staffName||'')+' ngày '+r.dateKey+'?\nCông sẽ được ghi vào Bảng Công.'))return;
    try{ await DBService.approveMakeupRequest(r,adminName()); loadTab(curTab); refreshPendingCount(); }
    catch(e){ alert('Lỗi duyệt: '+(e.message||e)) }
};

window.rejectOne=async function(id){
    const reason=prompt('Lý do từ chối (nhân viên sẽ thấy):');
    if(reason===null)return;
    try{ await DBService.rejectMakeupRequest(id,adminName(),reason); loadTab(curTab); refreshPendingCount(); }
    catch(e){ alert('Lỗi: '+(e.message||e)) }
};

window.approveBatch=async function(bk){
    const reqs=curReqs.filter(r=>(r.batchId||r.id)===bk);
    if(!confirm('Duyệt TẤT CẢ '+reqs.length+' yêu cầu của nhóm này?'))return;
    for(const r of reqs){
        try{ await DBService.approveMakeupRequest(r,adminName()) }
        catch(e){ alert('Lỗi ở yêu cầu ngày '+r.dateKey+': '+(e.message||e)); break }
    }
    loadTab(curTab); refreshPendingCount();
};

document.addEventListener('DOMContentLoaded',async function(){
    if(window.waitAuth){try{await window.waitAuth()}catch(e){}}
    if(!guardAdmin())return;
    loadTab('pending');
    if(window.lucide)lucide.createIcons();
});
</script>
</body>
</html>
